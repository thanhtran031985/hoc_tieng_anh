<!-- @dsCard group="Chung · Trạng thái dữ liệu" height=420 subtitle="Mọi màn có dữ liệu đều có 4 trạng thái: bình thường, đang tải (khung xương), trống, lỗi có nút Thử lại" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Trạng thái dữ liệu — preview</title>
<style>
  body { background: var(--bg); padding: 8px; }
  .g { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .p { background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); height: 380px; display: flex; flex-direction: column; overflow: hidden; }
  .p h3 { font: 800 13px/16px var(--font-body); color: var(--ink-soft); padding: 12px 16px 0; }
  .sk { padding: 16px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .sk .cell { display: flex; flex-direction: column; gap: 8px; align-items: center; background: var(--bg); padding: 12px; border-radius: var(--radius-md); }
  .p .b-state { padding: 8px 16px 16px; gap: 6px; }
  .p .b-state .title { font-size: 22px; line-height: 28px; }
  .p .b-state .body-l { font-size: 16px; line-height: 22px; }
</style></head>
<body>
<div class="g b-root" id="g"></div>
<script>
  var B = window.Bong;
  var cell = '<div class="cell">' + B.sk('64px', '64px', '50%') + B.sk('70%', '14px', 'var(--radius-pill)') + B.sk('45%', '12px', 'var(--radius-pill)') + '</div>';
  document.getElementById('g').innerHTML =
    '<div class="p"><h3>Đang tải · khung xương</h3><div class="sk">' + cell + cell + cell + cell + cell + cell + '</div></div>' +
    '<div class="p"><h3>Trống</h3>' + B.stateBlock({ kind: 'empty', expr: 'suynghi', size: 140, title: 'Sổ từ còn trống', text: 'Học bài đầu tiên để thêm từ mới nhé!', action: B.btn({ label: 'Học ngay', size: 'm' }) }) + '</div>' +
    '<div class="p"><h3>Lỗi</h3>' + B.stateBlock({ kind: 'error', size: 140, title: 'Ối, mạng chập chờn rồi', text: 'Không phải lỗi của bé đâu. Mình thử lại nhé!' }).replace('b-btn--l', 'b-btn--m') + '</div>';
</script>
</body>
</html>
