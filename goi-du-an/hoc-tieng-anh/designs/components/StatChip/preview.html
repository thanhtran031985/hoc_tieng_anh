<!-- @dsCard group="Chung · Hiển thị" height=200 subtitle="Thanh trên cùng: hồ sơ bé, sao, xu, chuỗi ngày học" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Thanh trên cùng — preview</title>
<style> body { background: var(--bg); } .tb { background: var(--bg); border-radius: 12px; box-shadow: 0 0 0 1px var(--line); margin: 12px 4px; } .tb .b-topbar { padding: 0 24px; } </style></head>
<body>
<div class="tb b-root" id="a"></div>
<div class="dsf-demo" id="b"></div>
<script>
  var B = window.Bong;
  document.getElementById('a').innerHTML = B.topbar({ kid: B.kids[0], stars: 128, coins: 340, streak: 5 });
  document.getElementById('b').innerHTML = B.stat('stars', 128, 'sao') + B.stat('coins', 340, 'xu') + B.stat('streak', 5, 'ngày học liên tiếp') + '<span class="caption b-muted">Số dùng kiểu chữ <b>stat</b>; tên đầy đủ đọc cho trình đọc màn hình.</span>';
</script>
</body>
</html>
