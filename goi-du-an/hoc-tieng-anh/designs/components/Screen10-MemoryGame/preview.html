<!-- @dsCard group="Màn Tiểu học · 6–9 Bài học" height=700 subtitle="9a. Mini game Lật thẻ ghép cặp — ghép hình với từ; mũi tên di chuyển, Enter lật" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Lật thẻ ghép cặp — preview</title>
<style>
  .gh { display: flex; align-items: center; gap: var(--space-6); }
  .gh .chipc { display: flex; align-items: center; gap: var(--space-2); background: var(--surface); border-radius: var(--radius-pill); padding: 6px 16px 6px 8px; box-shadow: var(--shadow-card); font: 800 18px/24px var(--font-body); }
  .gh .chipc .ci { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--lv-soft); color: var(--lv-ink); }
  .grid { display: grid; grid-template-columns: repeat(6, calc(min(236px, 27cqh) * .84)); gap: var(--space-5); perspective: 1400px; }
  .mc { height: min(236px, 27cqh); border: 0; padding: 0; background: none; cursor: pointer; position: relative; border-radius: var(--radius-lg); }
  .mc .in { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform 420ms cubic-bezier(.3,1.3,.5,1); }
  .mc.up .in { transform: rotateY(180deg); }
  .mc .f { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: var(--radius-lg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-2); }
  .mc .bk { background: var(--lv); box-shadow: 0 6px 0 var(--lv-shade); overflow: hidden; }
  .mc .bk::before { content: ""; position: absolute; inset: 10px; border-radius: calc(var(--radius-lg) - 6px); border: 3px dashed rgba(255,255,255,.55); }
  .mc .bk .b-ico { width: 44%; height: auto; opacity: .95; }
  .mc .fr { transform: rotateY(180deg); background: var(--surface); border: var(--border-thick) solid var(--line); box-shadow: 0 6px 0 var(--line); box-sizing: border-box; }
  .mc .fr .b-pic { width: 70%; height: auto; }
  .mc .fr .word { color: var(--ink); }
  .mc:hover:not(.up) .in { transform: translateY(-4px); }
  .mc.ok .fr { border-color: var(--success); background: var(--success-soft); box-shadow: 0 6px 0 var(--success-shade); }
  .mc.no .fr { border-color: var(--retry); background: var(--retry-soft); box-shadow: 0 6px 0 var(--retry-shade); }
  .mc.ok { animation: b-pop .45s ease; }
  .tip { display: flex; align-items: center; gap: var(--space-3); }
  .tip .b-dragon { width: 76px; height: auto; margin-top: -24px; }
  .tip .b-bubble { max-width: 420px; padding: var(--space-3) var(--space-5); }
  .tip .b-bubble::after { left: -9px; bottom: auto; top: 40%; }
</style></head>
<body>
<div id="root"></div>
<script>
(function () {
  var B = window.Bong;
  var W = ['cat', 'dog', 'fish', 'apple', 'banana', 'ball'];
  var DECK = [3, 7, 0, 10, 5, 1, 8, 4, 11, 2, 6, 9]; // xáo sẵn để bản xem trước ổn định
  var S = { up: [], ok: {}, moves: 0, tip: 'Tìm hình và chữ giống nhau nhé!', expr: 'chao', busy: false };
  function card(k) { var w = W[k % 6], isPic = k < 6; return { w: w, pic: isPic }; }
  function head() { return '<header class="lesson-head"><button type="button" class="b-iconbtn" aria-label="Thoát trò chơi" data-exit>' + B.icon('close', 26) + '</button><h1 class="title" style="flex:1">Lật thẻ ghép cặp</h1><div class="gh"><span class="chipc"><span class="ci">' + B.icon('check', 18) + '</span>' + Object.keys(S.ok).length + '/6 cặp</span><span class="chipc"><span class="ci">' + B.icon('flip', 18) + '</span>' + S.moves + ' lượt</span></div></header>'; }
  function foot(off) { return '<footer class="lesson-foot"><div>' + B.btn({ label: 'Chơi lại', variant: 'secondary', size: 'l', icon: 'replay', attrs: 'data-reset', disabled: off }) + (off ? '' : '<div class="tip" aria-live="polite">' + B.dragon(S.expr, 76) + B.bubble(S.tip, 'side') + '</div>') + '<span class="caption b-muted" style="width:180px;text-align:right">Không giới hạn lượt, cứ thong thả nhé!</span></div></footer>'; }
  function body() {
    return head() + '<main class="lesson-main"><div class="grid" role="grid" aria-label="12 thẻ">' + DECK.map(function (k, idx) {
      var c = card(k), up = S.up.indexOf(idx) >= 0 || S.ok[c.w], cls = up ? ' up' : '';
      if (S.ok[c.w]) cls += ' ok';
      return '<button type="button" class="mc' + cls + '" data-idx="' + idx + '" aria-label="' + (up ? (c.pic ? 'Hình ' : 'Chữ ') + c.w : 'Thẻ úp số ' + (idx + 1)) + '"' + (S.ok[c.w] ? ' aria-disabled="true"' : '') + '><span class="in"><span class="f bk">' + B.icon('star', 64) + '</span><span class="f fr">' +
        (c.pic ? B.pic(c.w, 140) : '<span class="word en">' + c.w + '</span>' + (up ? B.speak(c.w, 's') : '')) + '</span></span></button>';
    }).join('') + '</div></main>' + foot();
  }
  B.screen({
    fit: true, level: 1,
    notes: { normal: 'Lật 2 thẻ: khớp → giữ ngửa, viền xanh, sao bay. Không khớp → viền cam nhẹ rồi úp lại. Không đếm giờ, không trừ điểm.', loading: 'Khung xương 12 thẻ.', empty: 'Chưa đủ từ đã học để chơi (cần ít nhất 6 từ).', error: 'Không tải được trò chơi.' },
    states: {
      normal: body,
      loading: function () { var o = ''; for (var i = 0; i < 12; i++) o += '<span class="b-sk" style="height:min(236px,27cqh);border-radius:var(--radius-lg)"></span>'; return '<header class="lesson-head">' + B.sk('52px', '52px', '50%') + B.sk('260px', '32px', 'var(--radius-pill)') + '</header><main class="lesson-main"><div class="grid">' + o + '</div></main>' + foot(true); },
      empty: function () { return head() + '<main class="lesson-main">' + B.stateBlock({ kind: 'empty', expr: 'suynghi', title: 'Cần thêm từ để chơi', text: 'Bé học thêm 2 từ nữa là mở được trò Lật thẻ nhé!', action: B.btn({ label: 'Đi học từ mới', size: 'l', icon: 'map' }) }) + '</main>' + foot(true); },
      error: function () { return head() + '<main class="lesson-main">' + B.stateBlock({ kind: 'error', title: 'Trò chơi chưa mở được', text: 'Mạng đang chậm. Mình thử lại nhé!' }) + '</main>' + foot(true); }
    },
    mount: {
      normal: function (scr, ctx) {
        function rerender(focusIdx) { ctx.setState('normal'); if (focusIdx != null) { var f = ctx.scr.querySelector('[data-idx="' + focusIdx + '"]'); f && f.focus({ preventScroll: true }); } }
        function flip(idx) {
          var c = card(DECK[idx]); if (S.busy || S.ok[c.w] || S.up.indexOf(idx) >= 0) return;
          S.up.push(idx); if (!c.pic) B.say(c.w);
          if (S.up.length === 2) {
            S.moves++; var a = card(DECK[S.up[0]]), b = card(DECK[S.up[1]]);
            if (a.w === b.w) { S.ok[a.w] = true; S.up = []; S.expr = 'vui'; S.tip = '<b class="en">' + a.w + '</b> — ' + B.words[a.w].vi + '. Giỏi quá!'; rerender(idx); ctx.burst(ctx.scr.querySelector('[data-idx="' + idx + '"]'));
              if (Object.keys(S.ok).length === 6) ctx.later(function () { ctx.feedback({ type: 'ok', title: 'Ghép xong 6 cặp!', detail: '<span>Bé dùng <b>' + S.moves + ' lượt</b> và nhận <b>+20 xu</b>.</span>', action: 'Chơi tiếp', onAction: function () { S.ok = {}; S.moves = 0; S.expr = 'chao'; S.tip = 'Tìm hình và chữ giống nhau nhé!'; rerender(); } }); }, 700);
            } else {
              S.busy = true; S.expr = 'dongvien'; S.tip = 'Chưa khớp rồi. Nhớ vị trí và thử lại nhé!'; rerender(idx);
              S.up.forEach(function (i) { ctx.scr.querySelector('[data-idx="' + i + '"]').classList.add('no'); });
              ctx.later(function () { S.up = []; S.busy = false; rerender(idx); }, 1100);
            }
          } else rerender(idx);
        }
        scr.querySelectorAll('.mc').forEach(function (b) { b.addEventListener('click', function (e) { if (e.target.closest('.b-speak')) return; flip(+b.dataset.idx); }); });
        scr.querySelector('[data-reset]').addEventListener('click', function () { S.ok = {}; S.up = []; S.moves = 0; S.expr = 'chao'; S.tip = 'Tìm hình và chữ giống nhau nhé!'; rerender(); });
        scr.querySelector('[data-exit]').addEventListener('click', function () { ctx.dialog({ expr: 'dongvien', title: 'Dừng trò chơi?', body: 'Bé đã ghép được ' + Object.keys(S.ok).length + '/6 cặp rồi đó!', actions: [{ label: 'Chơi tiếp', variant: 'primary', key: 'Enter' }, { label: 'Dừng lại', variant: 'secondary', key: 'Esc' }] }); });
        ctx.onKey(function (e) {
          var a = document.activeElement, idx = a && a.dataset && a.dataset.idx != null ? +a.dataset.idx : null;
          var mv = { ArrowRight: 1, ArrowLeft: -1, ArrowDown: 6, ArrowUp: -6 }[e.key];
          if (mv) { e.preventDefault(); var n = idx == null ? 0 : Math.max(0, Math.min(11, idx + mv)); scr.querySelector('[data-idx="' + n + '"]').focus(); }
        });
      }
    }
  });
})();
</script>
</body>
</html>
