<!-- @dsCard group="Chung · Lớp phủ" height=480 subtitle="Hộp thoại xác nhận — Esc để đóng, Tab vòng trong hộp" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Hộp thoại — preview</title>
<style> body { background: var(--bg); padding: 8px; } .scr { height: 460px; border-radius: 12px; box-shadow: 0 0 0 1px var(--line); } .scr .mid { flex: 1; display: grid; place-items: center; } </style></head>
<body>
<div class="scr" id="s"><div class="mid"><div id="open"></div></div></div>
<script>
  var B = window.Bong, s = document.getElementById('s');
  document.getElementById('open').innerHTML = B.btn({ label: 'Mở hộp thoại', variant: 'secondary', attrs: 'id="o"' });
  function show() {
    B.dialog(s, { expr: 'suynghi', title: 'Bé muốn nghỉ một chút à?', body: 'Bông sẽ giữ chỗ cho bé. Lần sau mình học tiếp từ câu 4 nhé.',
      actions: [{ label: 'Học tiếp', variant: 'primary', key: 'Enter' }, { label: 'Nghỉ đã', variant: 'secondary', key: 'Esc' }] });
  }
  document.getElementById('o').addEventListener('click', show);
  show();
</script>
</body>
</html>
