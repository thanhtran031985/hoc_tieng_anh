<!-- @dsCard height=288 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Cover</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); position: relative; overflow: hidden; width: 960px; height: 288px; }
  svg { position: absolute; left: 0; top: 0; }
  .a { fill: var(--level-1); } .b { fill: var(--brand); } .c { fill: var(--level-3); } .d { fill: var(--level-6); } .e { fill: var(--level-5); } .dot { fill: var(--surface); }
  .xl { rx: var(--radius-xl); } .pill { rx: 48px; }
  .name { position: absolute; left: 48px; bottom: 36px; width: 420px; }
  .name h1 { margin: 0; font: 800 80px/1.08 var(--font-display); color: var(--ink); letter-spacing: -.01em; }
  .name p { margin: 16px 0 0; font: 700 14px/18px var(--font-body); color: var(--ink-soft); }
</style></head>
<body>
<!--
  blocks: level-1 slab 240×176 (radius-xl) · brand pill 380×96 (radius-pill) · level-3 disc r88 · level-6 disc r40 · level-5 disc r24
  arrangement: staggered stack right of x=480, slab and teal disc bleed off the top/right edge, pill bleeds right
  pattern: discs (soft, friendly, large radii — the README's "kẹo dẻo" rounded system) — 3×4 surface dots cut into the amber slab
  scales: dot pitch space-6 (24px), dot r 6, corners radius-xl (32) and pill (half of 96)
-->
<svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
  <rect class="a xl" x="512" y="-32" width="240" height="176"/>
  <circle class="c" cx="868" cy="64" r="88"/>
  <rect class="b pill" x="608" y="168" width="380" height="96"/>
  <circle class="d" cx="536" cy="216" r="40"/>
  <circle class="e" cx="792" cy="148" r="24"/>
  <g class="dot">
    <circle cx="560" cy="24" r="6"/><circle cx="584" cy="24" r="6"/><circle cx="608" cy="24" r="6"/><circle cx="632" cy="24" r="6"/>
    <circle cx="560" cy="48" r="6"/><circle cx="584" cy="48" r="6"/><circle cx="608" cy="48" r="6"/><circle cx="632" cy="48" r="6"/>
    <circle cx="560" cy="72" r="6"/><circle cx="584" cy="72" r="6"/><circle cx="608" cy="72" r="6"/><circle cx="632" cy="72" r="6"/>
  </g>
</svg>
<div class="name"><h1>Học cùng<br>Bông</h1><p>Học tiếng Anh lớp 1–9 · lõi chung và bộ Tiểu học</p></div>
</body>
</html>
