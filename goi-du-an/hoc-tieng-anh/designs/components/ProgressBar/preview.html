<!-- @dsCard group="Chung · Hiển thị" height=230 subtitle="Thanh tiến độ mang màu của cấp đang học" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Thanh tiến độ — preview</title>
<style>
  body { background: var(--bg); padding: 16px; }
  .r { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; max-width: 760px; }
  .r .n { font: 800 16px/20px var(--font-body); color: var(--ink-soft); width: 150px; }
  .r .c { font: 800 16px/20px var(--font-body); color: var(--ink-soft); width: 48px; }
</style></head>
<body>
<div id="r"></div>
<script>
  var B = window.Bong;
  var rows = [[1, 3, 10], [2, 7, 10], [4, 10, 10], [7, 2, 10]];
  document.getElementById('r').innerHTML = rows.map(function (x) {
    return '<div class="r" data-level="' + x[0] + '"><span class="n">' + B.levelChip(x[0]) + '</span>' + B.ProgressBar(x[1], x[2]) + '<span class="c">' + x[1] + '/' + x[2] + '</span></div>';
  }).join('') + '<div class="r" data-level="3"><span class="n label">Nhỏ (12px)</span><div class="b-progress b-progress--s"><span style="width:60%"></span></div><span class="c">6/10</span></div>';
</script>
</body>
</html>
