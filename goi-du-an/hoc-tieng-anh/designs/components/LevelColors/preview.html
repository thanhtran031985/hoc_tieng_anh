<!-- @dsCard group="Chung · Màu" height=640 subtitle="10 màu chủ đạo cho 10 cấp, màu phản hồi và 5 mức độ thuộc" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Màu cấp — preview</title>
<style>
  body { background: var(--bg); padding: 8px; }
  h3 { font: 800 14px/18px var(--font-body); color: var(--ink-soft); margin: 6px 4px 10px; }
  .lv { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 18px; }
  .t { border-radius: var(--radius-lg); overflow: hidden; background: var(--surface); box-shadow: var(--shadow-card); }
  .t .top { background: var(--lv); color: var(--on-lv); padding: 12px 14px 10px; box-shadow: inset 0 -6px 0 var(--lv-shade); min-height: 66px; }
  .t .n { font: 800 13px/16px var(--font-body); opacity: .9; }
  .t .nm { font: 800 22px/26px var(--font-display); }
  .t .bot { display: flex; gap: 6px; padding: 10px 12px; align-items: center; }
  .sw { width: 22px; height: 22px; border-radius: 6px; box-shadow: inset 0 0 0 1px rgba(43,36,64,.12); }
  .t .ink { font: 800 14px/18px var(--font-body); color: var(--lv-ink); margin-left: auto; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .fb { flex: 1; min-width: 220px; border-radius: var(--radius-lg); padding: 14px 16px; display: flex; gap: 12px; align-items: center; }
  .fb b { font: 800 20px/24px var(--font-display); }
  .m { flex: 1; min-width: 150px; background: var(--surface); border: var(--border-thick) solid; border-radius: var(--radius-lg); padding: 10px 12px; }
  .pips { display: flex; gap: 4px; margin-top: 6px; } .pips i { width: 10px; height: 10px; border-radius: 50%; background: var(--surface-sunk); } .pips i.on { background: currentColor; }
</style></head>
<body>
<h3>10 CẤP · 5 đảo Tiểu học, 5 thành phố THCS — mỗi cấp: nền, gờ, nền nhạt, chữ</h3>
<div class="lv" id="lv"></div>
<h3>PHẢN HỒI · không dùng đỏ gắt</h3>
<div class="row" id="fb"></div>
<h3>5 MỨC ĐỘ THUỘC (viền thẻ trong Sổ từ, luôn kèm số chấm)</h3>
<div class="row" id="m"></div>
<script>
  var B = window.Bong;
  document.getElementById('lv').innerHTML = B.levels.map(function (l) {
    return '<div class="t" data-level="' + l.n + '"><div class="top"><div class="n">Cấp ' + l.n + ' · ' + (l.kind === 'island' ? 'Đảo' : 'Thành phố') + '</div><div class="nm">' + l.name + '</div></div>' +
      '<div class="bot"><span class="sw" style="background:var(--lv)"></span><span class="sw" style="background:var(--lv-shade)"></span><span class="sw" style="background:var(--lv-soft)"></span><span class="ink">level-' + l.n + '</span></div></div>';
  }).join('');
  document.getElementById('fb').innerHTML =
    '<div class="fb" style="background:var(--success-soft)"><span style="color:var(--success)">' + B.icon('check', 32) + '</span><div><b style="color:var(--success-shade)">Chính xác!</b><div class="caption b-muted">success · success-soft · success-shade</div></div></div>' +
    '<div class="fb" style="background:var(--retry-soft)"><span style="color:var(--retry)">' + B.icon('replay', 32) + '</span><div><b style="color:var(--retry-shade)">Thử lại nhé!</b><div class="caption b-muted">retry · retry-soft · retry-shade</div></div></div>' +
    '<div class="fb" style="background:var(--surface)">' + B.icon('star', 32) + B.icon('coin', 32) + B.icon('flame', 32) + '<div class="caption b-muted">star · coin · streak</div></div>';
  var ml = ['Mới gặp', 'Đang nhớ', 'Khá nhớ', 'Nhớ tốt', 'Thuộc lòng'];
  document.getElementById('m').innerHTML = ml.map(function (t, i) {
    var p = ''; for (var k = 0; k < 5; k++) p += '<i class="' + (k <= i ? 'on' : '') + '"></i>';
    return '<div class="m" style="border-color:var(--mastery-' + (i + 1) + ');color:var(--mastery-' + (i + 1) + ')"><div class="label" style="color:var(--ink)">' + (i + 1) + ' · ' + t + '</div><div class="pips">' + p + '</div></div>';
  }).join('');
</script>
</body>
</html>
