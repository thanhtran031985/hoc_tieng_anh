<!-- @dsCard group="Chung · Lớp phủ" height=420 subtitle="Dải phản hồi trượt lên từ dưới: đúng (xanh lá) và chưa đúng (cam nhẹ)" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Dải phản hồi — preview</title>
<style> body { background: var(--bg); padding: 8px; } .scr { height: 400px; border-radius: 12px; box-shadow: 0 0 0 1px var(--line); } .scr .mid { flex: 1; display: flex; gap: 16px; align-items: flex-start; justify-content: center; padding-top: 48px; } </style></head>
<body>
<div class="scr" id="s"><div class="mid" id="m"></div><div class="b-burst-layer"></div></div>
<script>
  var B = window.Bong, s = document.getElementById('s');
  document.getElementById('m').innerHTML = B.btn({ label: 'Xem dải Đúng', variant: 'success', attrs: 'id="ok"' }) + B.btn({ label: 'Xem dải Chưa đúng', variant: 'retry', attrs: 'id="no"' });
  function ok() { B.feedback(s, { type: 'ok', title: 'Chính xác! Giỏi quá!', detail: B.speak('cat', 's') + '<b class="en" style="font-size:24px">cat</b><span class="b-muted">/kæt/ · con mèo</span>' }); B.burst(s.querySelector('.b-burst-layer'), document.getElementById('ok')); }
  function no() { B.feedback(s, { type: 'retry', title: 'Chưa đúng rồi, thử lại nhé!', detail: 'Bé nghe lại thật kỹ nha. Bông tin bé làm được!', action: 'Thử lại' }); }
  document.getElementById('ok').addEventListener('click', ok);
  document.getElementById('no').addEventListener('click', no);
  setTimeout(ok, 300);
</script>
</body>
</html>
