<!-- @dsCard group="Màn Tiểu học · 6–9 Bài học" height=700 subtitle="7. Thẻ từ — Space lật thẻ xem nghĩa, ← → chuyển thẻ, bấm loa để nghe từ và câu ví dụ" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Thẻ từ — preview</title>
<style>
  .fcw { display: flex; align-items: center; gap: var(--space-8); }
  .arrow { width: 72px; height: 72px; border-radius: 50%; border: 0; background: var(--surface); color: var(--ink); cursor: pointer; display: grid; place-items: center; box-shadow: inset 0 0 0 2px var(--line), 0 6px 0 var(--line); position: relative; transition: transform var(--duration-fast); }
  .arrow:hover:not(:disabled) { transform: translateY(-2px); } .arrow:active:not(:disabled) { transform: translateY(4px); box-shadow: inset 0 0 0 2px var(--line), 0 1px 0 var(--line); }
  .arrow:disabled { opacity: .4; cursor: default; }
  .arrow .b-key { position: absolute; bottom: -34px; left: 50%; transform: translateX(-50%); }
  .fc { width: min(920px, 64cqw); height: min(460px, 56cqh); perspective: 1800px; cursor: pointer; }
  .fc__in { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform 520ms cubic-bezier(.3,1.25,.5,1); }
  .fc.is-flipped .fc__in { transform: rotateY(180deg); }
  .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: var(--radius-xl); background: var(--surface); box-shadow: 0 8px 0 var(--line), 0 20px 40px rgba(91,66,30,.10); display: grid; grid-template-columns: 44% 1fr; overflow: hidden; }
  .face--back { transform: rotateY(180deg); background: var(--lv-soft); grid-template-columns: 1fr; place-items: center; text-align: center; }
  .face .art { background: var(--lv-soft); display: grid; place-items: center; }
  .face .art .b-pic { width: 76%; height: auto; }
  .face .txt { padding: var(--space-8) var(--space-10); display: flex; flex-direction: column; justify-content: center; gap: var(--space-3); }
  .face .wrow { display: flex; align-items: center; gap: var(--space-4); }
  .face .ex { margin-top: var(--space-4); padding: var(--space-4); background: var(--surface-soft); border-radius: var(--radius-md); display: flex; align-items: center; gap: var(--space-3); }
  .face .flipnote { margin-top: auto; display: flex; align-items: center; gap: var(--space-2); color: var(--ink-soft); }
  .face--back .vi { font: 800 56px/64px var(--font-display); color: var(--lv-ink); }
  .face--back .bx { display: flex; flex-direction: column; align-items: center; gap: var(--space-3); }
  .dots { display: flex; gap: var(--space-2); }
  .dots i { width: 12px; height: 12px; border-radius: 50%; background: var(--surface-sunk); } .dots i.on { background: var(--lv); width: 32px; border-radius: 6px; }
  @container (max-height: 800px) { .face .txt { padding: var(--space-6) var(--space-8); gap: var(--space-2); } .face .ex { margin-top: var(--space-2); } .word-xl { font-size: 60px; line-height: 66px; } }
</style></head>
<body>
<div id="root"></div>
<script>
(function () {
  var B = window.Bong;
  var CARDS = ['apple', 'banana', 'grapes', 'orange', 'pear', 'strawberry'];
  var S = { i: 0, flip: false };
  function head(n, m) { return '<header class="lesson-head"><button type="button" class="b-iconbtn" aria-label="Thoát bài học" data-exit>' + B.icon('close', 26) + '</button>' + B.ProgressBar(n, m) + '<span class="count">' + n + '/' + m + '</span></header>'; }
  function foot(off) { var last = S.i === CARDS.length - 1; return '<footer class="lesson-foot"><div>' + B.btn({ label: S.flip ? 'Xem từ' : 'Lật thẻ', variant: 'secondary', size: 'l', icon: 'flip', key: 'Space', attrs: 'data-flip', disabled: off }) + B.btn({ label: last ? 'Làm bài tập' : 'Thẻ tiếp', size: 'l', key: 'Enter', attrs: 'data-next', disabled: off }) + '</div></footer>'; }
  function body() {
    var w = CARDS[S.i], d = B.words[w], dots = CARDS.map(function (_, k) { return '<i class="' + (k === S.i ? 'on' : '') + '"></i>'; }).join('');
    return head(S.i + 1, CARDS.length) + '<main class="lesson-main"><div class="instr"><h1 class="title">' + (S.flip ? 'Nghĩa của từ' : 'Học từ mới') + '</h1></div>' +
      '<div class="fcw"><button type="button" class="arrow" data-prev aria-label="Thẻ trước" aria-keyshortcuts="ArrowLeft"' + (S.i === 0 ? ' disabled' : '') + '>' + B.icon('back', 34) + B.key('←') + '</button>' +
      '<div class="fc' + (S.flip ? ' is-flipped' : '') + '" data-card role="group" aria-label="Thẻ từ ' + w + '"><div class="fc__in">' +
      '<div class="face" aria-hidden="' + S.flip + '"><div class="art">' + B.pic(w, 260) + '</div><div class="txt"><span class="label b-muted">Trái cây · Fruits</span><div class="wrow">' + B.speak(w, 'm') + '<span class="word-xl en">' + w + '</span></div><span class="body-l b-muted">' + d.ipa + '</span>' +
      '<div class="ex">' + B.speak(d.ex, 's', 'Nghe câu ví dụ') + '<span class="body-l en" style="font-weight:600">' + d.ex.replace(new RegExp(w, 'i'), function (m) { return '<b>' + m + '</b>'; }) + '</span></div>' +
      '<span class="flipnote label">' + B.icon('flip', 20) + 'Bấm vào thẻ hoặc ' + B.key('Space') + ' để xem nghĩa</span></div></div>' +
      '<div class="face face--back" aria-hidden="' + !S.flip + '"><div class="bx">' + B.pic(w, 120) + '<div class="wrow">' + B.speak(w, 's') + '<b class="word en">' + w + '</b></div><div class="vi">' + d.vi + '</div><p class="body-l">' + d.exVi + '</p></div></div>' +
      '</div></div><button type="button" class="arrow" data-nextc aria-label="Thẻ sau" aria-keyshortcuts="ArrowRight"' + (S.i === CARDS.length - 1 ? ' disabled' : '') + '>' + B.icon('next', 34) + B.key('→') + '</button></div>' +
      '<div class="dots" aria-hidden="true">' + dots + '</div></main>' + foot();
  }
  B.screen({
    fit: true, level: 1,
    notes: { normal: 'Mặt trước: hình, từ, phiên âm, câu ví dụ (đều có loa). Mặt sau: nghĩa tiếng Việt. Thẻ lật 3D.', loading: 'Khung xương đúng hình thẻ.', empty: 'Bộ thẻ rỗng.', error: 'Không tải được bộ thẻ.' },
    states: {
      normal: body,
      loading: function () { return head(0, 6) + '<main class="lesson-main">' + B.sk('220px', '36px', 'var(--radius-pill)') + '<div class="fcw">' + B.sk('72px', '72px', '50%') + '<div class="face" style="position:relative;width:min(920px,64cqw);height:min(460px,56cqh)"><span class="b-sk" style="width:100%;height:100%;border-radius:0"></span><div class="txt">' + B.sk('120px', '18px', 'var(--radius-pill)') + B.sk('300px', '64px', 'var(--radius-md)') + B.sk('140px', '22px', 'var(--radius-pill)') + B.sk('100%', '64px', 'var(--radius-md)') + '</div></div>' + B.sk('72px', '72px', '50%') + '</div></main>' + foot(true); },
      empty: function () { return head(0, 6) + '<main class="lesson-main">' + B.stateBlock({ kind: 'empty', title: 'Chưa có thẻ từ nào', text: 'Bộ thẻ của bài này đang được chuẩn bị. Bé làm bài khác trước nhé!', action: B.btn({ label: 'Về bản đồ', icon: 'map', size: 'l' }) }) + '</main>' + foot(true); },
      error: function () { return head(0, 6) + '<main class="lesson-main">' + B.stateBlock({ kind: 'error', title: 'Thẻ từ chưa tải xong', text: 'Mạng hơi chậm một chút. Mình thử lại nhé!' }) + '</main>' + foot(true); }
    },
    mount: {
      normal: function (scr, ctx) {
        function go(d) { var n = S.i + d; if (n < 0 || n >= CARDS.length) return; S.i = n; S.flip = false; ctx.setState('normal'); }
        function flip() { S.flip = !S.flip; var c = scr.querySelector('[data-card]'); c.classList.toggle('is-flipped', S.flip); c.querySelectorAll('.face')[0].setAttribute('aria-hidden', S.flip); c.querySelectorAll('.face')[1].setAttribute('aria-hidden', !S.flip); scr.querySelector('[data-flip] span').textContent = S.flip ? 'Xem từ' : 'Lật thẻ'; scr.querySelector('.instr .title').textContent = S.flip ? 'Nghĩa của từ' : 'Học từ mới'; }
        scr.querySelector('[data-card]').addEventListener('click', function (e) { if (!e.target.closest('button')) flip(); });
        scr.querySelector('[data-flip]').addEventListener('click', flip);
        scr.querySelector('[data-prev]').addEventListener('click', function () { go(-1); });
        scr.querySelector('[data-nextc]').addEventListener('click', function () { go(1); });
        scr.querySelector('[data-next]').addEventListener('click', function (e) { if (S.i === CARDS.length - 1) ctx.burst(e.currentTarget); else go(1); });
        scr.querySelector('[data-exit]').addEventListener('click', function () { ctx.dialog({ expr: 'dongvien', title: 'Bé muốn dừng bài học à?', body: 'Mình mới xem ' + (S.i + 1) + '/' + CARDS.length + ' thẻ. Lần sau học tiếp nhé!', actions: [{ label: 'Học tiếp', variant: 'primary', key: 'Enter' }, { label: 'Dừng lại', variant: 'secondary', key: 'Esc' }] }); });
        ctx.onKey(function (e) {
          if (e.key === ' ' || e.code === 'Space') { if (document.activeElement && document.activeElement.tagName === 'BUTTON' && !document.activeElement.matches('[data-flip]')) return; e.preventDefault(); flip(); }
          else if (e.key === 'ArrowLeft') { e.preventDefault(); go(-1); }
          else if (e.key === 'ArrowRight') { e.preventDefault(); go(1); }
          else if (e.key === 'Enter' && document.activeElement.tagName !== 'BUTTON') { e.preventDefault(); scr.querySelector('[data-next]').click(); }
        });
      }
    }
  });
})();
</script>
</body>
</html>
