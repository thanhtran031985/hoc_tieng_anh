<!-- @dsCard group="Màn Tiểu học · 1–2 Bắt đầu" height=700 subtitle="1a. Đăng nhập tài khoản gia đình (bố mẹ thao tác)" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Đăng nhập — preview</title>
<style>
  .lg { flex: 1; display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
  .lg__art { background: var(--bg-sea); position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-6); }
  .lg__art::before { content: ""; position: absolute; width: 140%; height: 46%; left: -20%; bottom: -22%; border-radius: 50%; background: var(--level-2); box-shadow: inset 0 14px 0 var(--level-2-soft); }
  .lg__art > * { position: relative; }
  .lg__brand { position: absolute; top: var(--space-8); left: var(--space-12); display: flex; align-items: center; gap: var(--space-3); }
  .lg__brand b { font: 800 28px/32px var(--font-display); color: var(--ink); }
  .lg__art > .b-dragon { width: min(340px, 40cqh); height: auto; }
  .lg__form { display: flex; align-items: center; justify-content: center; padding: var(--space-8); }
  .lg__card { width: 480px; display: flex; flex-direction: column; gap: var(--space-5); padding: var(--space-10) var(--space-10) var(--space-8); }
  .lg__card .row { display: flex; justify-content: space-between; align-items: center; }
  .pw { position: relative; } .pw .b-iconbtn { position: absolute; right: 6px; top: 6px; width: 44px; height: 44px; box-shadow: none; }
  .alert { display: flex; gap: var(--space-3); align-items: flex-start; background: var(--retry-soft); color: var(--ink); border-radius: var(--radius-md); padding: var(--space-4); }
  .alert .ic { color: var(--retry-shade); }
  .spin { width: 22px; height: 22px; border-radius: 50%; border: 3px solid currentColor; border-right-color: transparent; animation: sp .8s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .foot { text-align: center; color: var(--ink-soft); }
  .foot a { color: var(--brand-shade); font-weight: 800; }
  @container (max-height: 800px) { .lg__card { padding: var(--space-8); gap: var(--space-4); } }
</style></head>
<body>
<div id="root"></div>
<script>
  var B = window.Bong;
  function form(o) {
    var dis = o.busy ? ' disabled' : '';
    return '<div class="lg">' +
      '<section class="lg__art"><div class="lg__brand">' + B.dragon('vui', 44) + '<b>Học cùng Bông</b></div>' + B.bubble('Chào cả nhà! Tớ là <b>Bông</b>. Mình cùng học tiếng Anh nhé!') + B.dragon('chao', 340) + '</section>' +
      '<section class="lg__form"><form class="b-card lg__card" onsubmit="return false" aria-label="Đăng nhập">' +
      '<div><h1 class="display-l">Đăng nhập</h1><p class="body b-muted">Tài khoản gia đình — dành cho bố mẹ</p></div>' +
      (o.error ? '<div class="alert" role="alert"><span class="ic">' + B.icon('wifi', 28) + '</span><div><b class="label">Chưa kết nối được</b><div class="body b-muted">Kiểm tra mạng Wi-Fi rồi bấm Thử lại nhé.</div></div></div>' : '') +
      '<div class="b-field"><label for="em">Email hoặc số điện thoại</label><input class="b-input" id="em" type="text" autocomplete="username" placeholder="vd. 0912 345 678" value="' + (o.email || '') + '"' + dis + '></div>' +
      '<div class="b-field"><div class="row"><label for="pw">Mật khẩu</label>' + B.btn({ label: 'Quên mật khẩu?', variant: 'ghost', size: 's' }) + '</div><div class="pw"><input class="b-input" id="pw" type="password" autocomplete="current-password" placeholder="Ít nhất 6 ký tự" value="' + (o.pw || '') + '"' + dis + '><button type="button" class="b-iconbtn" aria-label="Hiện mật khẩu" data-eye>' + B.icon('eye', 22) + '</button></div>' +
      (o.hint ? '<span class="b-hint">' + o.hint + '</span>' : '') + '</div>' +
      (o.busy ? '<button type="button" class="b-btn b-btn--primary b-btn--l b-btn--block" disabled><span class="spin"></span><span>Đang đăng nhập…</span></button>'
              : o.error ? B.btn({ label: 'Thử lại', icon: 'replay', size: 'l', block: true, attrs: 'data-retry' })
              : B.btn({ label: 'Đăng nhập', size: 'l', block: true, key: 'Enter', disabled: o.empty, attrs: 'data-login' })) +
      '<p class="foot body">Chưa có tài khoản? <a href="#" onclick="return false">Tạo tài khoản gia đình</a></p>' +
      '</form></section></div>';
  }
  B.screen({
    fit: true,
    notes: { normal: 'Đã nhập đủ — Enter hoặc bấm Đăng nhập.', loading: 'Đang gửi: ô nhập khoá, nút hiện vòng quay nhỏ trong nút (không che cả màn).', empty: 'Chưa nhập gì: nút Đăng nhập vô hiệu, có dòng gợi ý.', error: 'Mất mạng: giữ nguyên thông tin đã nhập, nút đổi thành Thử lại.' },
    states: {
      normal: function () { return form({ email: 'nguyen.gia@gmail.com', pw: 'hocvui2026' }); },
      loading: function () { return form({ email: 'nguyen.gia@gmail.com', pw: 'hocvui2026', busy: true }); },
      empty: function () { return form({ empty: true, hint: 'Nhập email (hoặc số điện thoại) và mật khẩu để tiếp tục.' }); },
      error: function () { return form({ email: 'nguyen.gia@gmail.com', pw: 'hocvui2026', error: true }); }
    },
    mount: {
      all: function (scr, ctx) {
        var eye = scr.querySelector('[data-eye]'), pw = scr.querySelector('#pw');
        if (eye) eye.addEventListener('click', function () { pw.type = pw.type === 'password' ? 'text' : 'password'; });
        var go = scr.querySelector('[data-login]');
        if (go) go.addEventListener('click', function () { ctx.setState('loading'); ctx.later(function () { ctx.setState('normal'); }, 1200); });
        if (ctx.state === 'empty') {
          var em = scr.querySelector('#em');
          var chk = function () { var b = scr.querySelector('[data-login]'); b.disabled = !(em.value && pw.value); };
          em.addEventListener('input', chk); pw.addEventListener('input', chk);
        }
        ctx.onKey(function (e) { if (e.key === 'Enter' && go && !go.disabled) go.click(); });
      }
    }
  });
</script>
</body>
</html>
