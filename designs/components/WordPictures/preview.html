<!-- @dsCard group="Chung · Hiển thị" height=420 subtitle="Hình minh hoạ từ vựng — nét viền dày, màu tươi, nền trong suốt" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Hình từ vựng — preview</title>
<style> body { background: var(--bg); padding: 8px; } .g { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; } .w { background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); padding: 10px 6px 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; } .w .r { display: flex; align-items: center; gap: 6px; } .w .en { font-size: 20px; font-weight: 700; } .w .vi { font: 700 12px/14px var(--font-body); color: var(--ink-soft); } </style></head>
<body><div class="g b-root" id="g"></div>
<script>
  var B = window.Bong;
  document.getElementById('g').innerHTML = Object.keys(B.words).map(function (k) { var w = B.words[k]; return '<div class="w">' + B.pic(k, 72) + '<div class="r">' + B.speak(k, 's') + '<span class="en">' + k + '</span></div><span class="vi">' + w.vi + ' · ' + B.topics[w.topic] + '</span></div>'; }).join('');
</script></body></html>
