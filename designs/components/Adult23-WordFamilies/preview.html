    filters: [{ key: 'lv', label: 'Cấp', options: [1, 2, 3].map(function (n) { return [String(n), 'Cấp ' + n]; }), match: function (r, v) { return String(r.lv) === v; } }, { key: 'status', label: 'Trạng thái', options: [['live', 'Đã xuất bản'], ['draft', 'Nháp']] }],
    columns: [{ key: 'rime', label: 'Vần', sort: true, render: function (x) { return '<span class="rm" lang="en">-<b>' + x.rime + '</b></span>'; } }, { key: 'ipa', label: 'Âm IPA', sort: true }, { key: 'lv', label: 'Cấp', sort: true, render: function (x) { return 'Cấp ' + x.lv + ' · ' + B.levels[x.lv - 1].name; } }, { key: 'n', label: 'Số từ', sort: true, align: 'right' },
      { key: 'status', label: 'Trạng thái', sort: true, render: function (x) { return x.status === 'live' ? A.status('live', 'Đã xuất bản') : A.status('draft', 'Nháp'); } }],
    actions: function (x) { return A.btn({ label: 'Sửa', variant: 'ghost', size: 's', icon: 'pen', attrs: 'data-edit="' + x.rime + '"' }); } });
  function page(m) { return A.shell3({ area: 'admin', active: 'families', title: 'Họ vần', crumb: 'Nội dung · từ cùng vần cho Họ vần và Ghép chữ đầu', actions: A.btn({ label: 'Thêm họ vần', icon: 'plus', attrs: 'data-new' }), main: m }); }
  A.screen({
    order: ['normal', 'table', 'suggest', 'errors', 'loading', 'empty', 'error'], labels: { normal: 'Ngăn kéo sửa họ', table: 'Bảng họ vần', suggest: 'Gợi ý từ trong kho', errors: 'Báo lỗi khi lưu' },
    notes: {
      normal: 'Ngăn kéo sửa họ -at: vần, âm IPA, cấp; từ thành viên lấy từ kho, mỗi từ chọn “Cùng âm” hoặc “Bẫy: khác âm” (← → đổi; từ bẫy viền nét đứt `trap-line`, chữ “at” gạch lượn sóng `trap-ink`); chữ đầu thành từ được tự tính, thêm chữ đầu không thành từ cho Ghép chữ đầu; đoạn văn vui Anh + Việt + âm thanh. Xem như học sinh mở giao diện Tiểu học.',
      table: 'Bảng các họ vần: vần (phần vần tô `rime-ink` trên `rime-bg`), âm IPA, cấp, số từ, trạng thái. Tìm, lọc Cấp / Trạng thái, sắp xếp, phân trang 8 dòng.',
      suggest: '“Gợi ý từ trong kho”: liệt kê mọi từ có chứa vần, tick để thêm; từ đã có bị khoá; từ đọc khác âm có nhãn “khác âm?” và được đánh dấu Bẫy khi thêm.',
      errors: 'Lưu khi vần là “at-” và IPA thiếu dấu /…/: lỗi hiện dưới ô (đồng thời báo khi rời ô).',
      loading: 'Khung xương bảng.', empty: 'Chưa có họ vần nào.', error: 'Không tải được họ vần.' },
    states: {
      normal: function () { return page(TABLE.html()); }, table: function () { return page(TABLE.html()); }, suggest: function () { return page(TABLE.html()); }, errors: function () { return page(TABLE.html()); },
      loading: function () { return page(A.skel('420px')); },
      empty: function () { return page('<section class="a-card">' + A.empty({ title: 'Chưa có họ vần nào', text: 'Tạo họ vần đầu tiên (ví dụ “-at”) rồi chọn các từ cùng vần trong kho.', action: A.btn({ label: 'Thêm họ vần', icon: 'plus' }) }) + '</section>'); },
      error: function () { return page('<section class="a-card">' + A.error({ code: 'FAM-500' }) + '</section>'); }
    },
    mount: { all: function (scr, ctx) {
      SCR = scr; if (['normal', 'table', 'suggest', 'errors'].indexOf(ctx.state) < 0) return;
      TABLE.mount(scr, bind); bind();
      function bind() { scr.querySelectorAll('[data-edit]').forEach(function (b) { b.onclick = function () { if (b.dataset.edit === 'at') open(); else A.toast(scr, 'Bản xem trước chỉ soạn sẵn họ “-at”.'); }; }); }
      scr.querySelectorAll('[data-new]').forEach(function (b) { b.addEventListener('click', function () { A.toast(scr, 'Thêm họ vần mới: mở ngăn kéo trống (giống ngăn kéo sửa).'); }); });
      if (ctx.state !== 'table') open(ctx.state);
    } }
  });
})();
</script>
</body>
</html>
