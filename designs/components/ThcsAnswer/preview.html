<!-- @dsCard group="THCS · Thành phần" height=470 subtitle="Ô đáp án A–D có nhãn phím (1–4 hoặc A–D): thường, rê chuột, đang chọn, đúng, chưa đúng, mờ" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Ô đáp án — preview</title>
<style> body { margin: 0; } .pane { padding: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; } .pane h3 { grid-column: 1 / -1; margin: 0; } .c { display: flex; flex-direction: column; gap: 4px; } </style></head>
<body>
<div class="pane thcs" data-theme="thcs" id="a"></div>
<div class="pane thcs" data-theme="thcs-toi" id="b"></div>
<script>
(function () {
  var B = window.Bong, T = B.T; B.suite('thcs');
  var S = [['', 'Thường', 'live'], ['is-hover', 'Rê chuột', 'lived'], ['is-selected', 'Đang chọn', 'has lived'], ['is-correct', 'Đúng', 'has lived'], ['is-retry', 'Chưa đúng', 'is living'], ['is-dim', 'Mờ (gợi ý loại)', 'live']];
  function pane(t) { return '<h3 class="thcs-label b-muted">' + t + '</h3>' + S.map(function (s, i) { var h = T.opt('ABCD'[i % 4], i % 4, s[2], s[0]); if (s[0] === 'is-correct') h = h.replace('<span class="t-opt__ic" aria-hidden="true"></span>', '<span class="t-opt__ic" aria-hidden="true">' + B.icon('check', 24) + '</span>'); if (s[0] === 'is-retry') h = h.replace('<span class="t-opt__ic" aria-hidden="true"></span>', '<span class="t-opt__ic" aria-hidden="true">' + B.icon('replay', 22) + '</span>'); return '<div class="c"><span class="thcs-caption b-muted">' + s[1] + '</span>' + h + '</div>'; }).join(''); }
  document.getElementById('a').innerHTML = pane('CHẾ ĐỘ SÁNG'); document.getElementById('b').innerHTML = pane('CHẾ ĐỘ TỐI');
})();
</script>
</body>
</html>
