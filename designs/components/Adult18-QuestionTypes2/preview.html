  /* ---------- Xem như học sinh (giao diện Tiểu học) ---------- */

  }
  function open(q) {
    var cur = q ? JSON.parse(JSON.stringify(q)) : { type: 'phonics', level: 1, status: 'draft', word: '', tiles: [] }, orig = q;
    var dr = A.drawer(SCR, { wide: true, title: q ? 'Sửa câu hỏi · ' + T[cur.type][0] : 'Thêm câu hỏi dạng mới', body: form(cur), foot: '<span style="flex:1"></span>' + A.btn({ label: 'Xem như học sinh', icon: 'eye', variant: 'secondary', attrs: 'data-prev' }) + A.btn({ label: q ? 'Lưu thay đổi' : 'Thêm câu hỏi', icon: 'check', attrs: 'data-save' }) });

      function cards() { if (!cd) return; var ws = ss.value.trim().split(/\s+/).filter(Boolean), n = nz.value.split(',').map(function (x) { return x.trim(); }).filter(Boolean); cd.innerHTML = ws.concat(n).map(function (x, i) { return '<span class="chip' + (i >= ws.length ? ' is-noise' : '') + '" lang="en">' + B.esc(x) + (i >= ws.length ? ' · nhiễu' : '') + '</span>'; }).join(''); }

      w.querySelectorAll('[data-type]').forEach(function (x) { x.setAttribute('aria-checked', x === b); x.style.borderColor = x === b ? 'var(--brand)' : ''; }); redraw(); }); });
    w.querySelector('[data-prev]').addEventListener('click', function () { var f = check(w, cur); if (f) { var e = w.querySelector(f); e && e.focus(); return; } preview(cur); });
    w.querySelector('[data-save]').addEventListener('click', function () { var f = check(w, cur); if (f) { var e = w.querySelector(f); e && e.focus(); return; }
      cur.text = { phonics: 'Ghép âm: ' + cur.word, speak: 'Nói: ' + cur.sent, order: 'Xếp câu: ' + cur.sent, dictation: 'Nghe và gõ: ' + cur.audio, fill: 'Điền: ' + cur.text, reading: 'Đọc hiểu: ' + (cur.passage || '').slice(0, 30) + '…', story: 'Truyện: ' + (STORIES.filter(function (x) { return x[0] === cur.story; })[0] || [0, ''])[1] }[cur.type];

  function page(m) { return A.shell2({ area: 'admin', active: 'questions', title: 'Ngân hàng câu hỏi · Dạng mới', crumb: 'Giai đoạn 2 · 7 dạng bài Tiểu học', actions: A.btn({ label: 'Thêm câu hỏi', icon: 'plus', attrs: 'data-new' }), main: m }); }
  function main() { return '<section class="a-card" style="margin-bottom:var(--space-4)"><h2 class="adm-h3" style="margin:0 0 8px">Thêm nhanh theo dạng</h2><div class="tiles">' + Object.keys(T).map(function (k) { return '<button type="button" class="tile" data-quick="' + k + '">' + B.icon(T[k][2], 18) + T[k][0] + '<span>' + T[k][1] + '</span></button>'; }).join('') + '</div></section>' + table.html(); }
  var ST = { phonics: 1, speak: 2, order: 3, dictation: 5, fill: 6, reading: 7, story: 8 };
  A.screen({
    order: ['normal', 'phonics', 'speak', 'order', 'dictation', 'fill', 'reading', 'story', 'loading', 'empty', 'error'],
    labels: { phonics: 'Ghép âm', speak: 'Luyện nói', order: 'Sắp xếp', dictation: 'Nghe gõ', fill: 'Điền từ', reading: 'Đọc hiểu', story: 'Truyện', empty: 'Trống' },
    notes: { normal: 'Bảng câu hỏi dạng mới (tìm, lọc Dạng / Cấp, sắp xếp, phân trang) + 7 ô “Thêm nhanh”. Bấm một dòng hoặc ô → ngăn kéo biểu mẫu. Mỗi tab trên mở sẵn ngăn kéo một dạng.', phonics: 'Ghép âm: nhập từ → “Tách thành ô âm” (sh, ch, th, ee, oo chung một ô) → chọn âm thanh từng ô, nút nghe, Gộp ô. Ví dụ “fish”: ô “sh” chưa có âm thanh → bấm Lưu để thấy lỗi dưới nhóm ô.', speak: 'Luyện nói: câu mẫu (≤ 12 từ), âm thanh mẫu (tải lên / tạo giọng đọc tự động), mức dễ tính 3 nấc, hình.', order: 'Sắp xếp câu: câu gốc tự tách thẻ (xem ngay), từ nhiễu (thẻ nền xám, viền nét đứt), báo lỗi khi nhiễu trùng từ trong câu.', dictation: 'Nghe và gõ: nội dung được đọc, các đáp án chấp nhận (mỗi dòng một), bỏ qua hoa/thường, dấu câu.', fill: 'Điền từ: câu có đúng một ___, 3–4 thẻ từ, chọn thẻ đúng.', reading: 'Đọc hiểu ngắn: đoạn 3–6 câu, hình, 2–3 câu hỏi 3 đáp án.', story: 'Truyện: chọn truyện đã xuất bản (bản nháp bị khoá kèm lời nhắc).', loading: 'Khung xương bảng.', empty: 'Chưa có câu hỏi dạng mới.', error: 'Không tải được câu hỏi.' },
