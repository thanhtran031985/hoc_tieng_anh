<!-- @dsCard group="Chung · Điều khiển" height=190 subtitle="Nhãn phím tắt nhỏ trên đáp án và trong nút" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Nhãn phím — preview</title>
<style>
  body { background: var(--bg); }
  .c { position: relative; width: 132px; height: 112px; }
  .c .b-choice { width: 100%; height: 100%; }
</style></head>
<body>
<div class="dsf-demo b-root" id="r"></div>
<script>
  var B = window.Bong;
  document.getElementById('r').innerHTML =
    '<div>' + ['1','2','3','4'].map(function (k) { return B.key(k); }).join(' ') + '<div class="cap">Số 1–4: chọn đáp án</div></div>' +
    '<div>' + B.key('Enter') + ' ' + B.key('Space') + ' ' + B.key('←') + ' ' + B.key('→') + '<div class="cap">Kiểm tra · Nghe lại · Chuyển thẻ</div></div>' +
    '<div class="c"><button class="b-choice">' + B.key('2', 'b-key--corner') + B.pic('dog', 72) + '</button><div class="cap">Ở góc trên trái thẻ đáp án</div></div>' +
    '<div>' + B.btn({ label: 'Kiểm tra', size: 'l', key: 'Enter' }) + '<div class="cap">Trong nút</div></div>';
</script>
</body>
</html>
