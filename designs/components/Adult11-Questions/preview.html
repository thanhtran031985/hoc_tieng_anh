<!doctype html>

<style>

  .abcd .o b { width: 28px; height: 28px; border-radius: 6px; background: var(--surface-sunk); display: grid; place-items: center; font: 700 13px/1 var(--font-thcs); }
  .abcd .o.ok b { background: var(--success); color: var(--surface); }

    } else {
      inner = '<div class="a-stu thcs" data-theme="thcs">' + (o.audio ? '<div>' + B.speak('What time does the bus to the museum leave?', 'm') + '</div>' : '') + '<p class="thcs-en" style="margin:0" lang="en">' + B.esc(o.text) + '</p>' +
        (o.type === 'abcd' ? '<div class="stu-thcs" role="radiogroup" aria-label="Đáp án">' + o.opts.map(function (t, i) { return B.T.opt('ABCD'[i], i, B.esc(t)).replace('data-i=', 'data-si=' + i + ' data-x='); }).join('') + '</div>' : '<input class="t-input" style="font-size:20px" aria-label="Câu trả lời" placeholder="Gõ câu trả lời…" data-fillin>' + '<div>' + B.T.btn({ label: 'Kiểm tra', attrs: 'data-chk' }) + '</div>') + '<p class="stu-why thcs-body-s" data-why hidden></p></div>';
    }
    var d = A.dialog(SCR, { title: 'Xem như học sinh · Cấp ' + lv + ' (' + (lv <= 5 ? 'giao diện Tiểu học' : 'giao diện THCS') + ')', wide: 640, body: inner + '<p class="adm-small" style="margin:0">Bấm thử một lựa chọn. Bản xem trước không lưu kết quả.</p>', actions: [{ label: 'Đóng', variant: 'primary' }] });
    var w = d.el, why = w.querySelector('[data-why]');
    function result(right) { why.hidden = false; why.innerHTML = right ? '<b>Chính xác!</b>' : '<b>Chưa đúng rồi.</b> ' + (o.expl ? B.esc(o.expl) : 'Đáp án đúng: ' + B.esc(o.type === 'fill' ? o.answer : (o.opts || o.pics)[o.ok])); }
    w.querySelectorAll('[data-si]').forEach(function (b) { b.addEventListener('click', function () { var i = +b.dataset.si, right = o.type === 'match' ? true : i === o.ok; w.querySelectorAll('[data-si]').forEach(function (x) { x.classList.remove('is-correct', 'is-retry'); x.setAttribute('aria-checked', x === b); }); b.classList.add(right ? 'is-correct' : 'is-retry'); result(right); }); });
    var chk = w.querySelector('[data-chk]'); chk && chk.addEventListener('click', function () { var v = w.querySelector('[data-fillin]').value.trim().toLowerCase(), ok = [o.answer].concat(o.alt ? o.alt.split(',') : []).some(function (a) { return a.trim().toLowerCase() === v; }); result(ok); });
  }
  function open(id) {
    var q = id ? QS.filter(function (x) { return x.id === id; })[0] : { type: 'abcd', level: 8, skill: 'Ngữ pháp', gram: '—', diff: 3, status: 'draft', opts: ['', '', '', ''], ok: null, expl: '' };
    var cur = Object.assign({}, q), st = q.status, df = q.diff;
    var dr = A.drawer(SCR, { wide: true, title: id ? 'Sửa câu hỏi' : 'Thêm câu hỏi', body: form(cur), foot: '<span style="flex:1"></span>' + A.btn({ label: 'Xem như học sinh', icon: 'eye', variant: 'secondary', attrs: 'data-prev' }) + A.btn({ label: id ? 'Lưu thay đổi' : 'Thêm câu hỏi', icon: 'check', attrs: 'data-qsave' }) });
    var w = dr.el;
    function wireSeg(g, fn) { g.querySelectorAll('[data-v]').forEach(function (b) { b.addEventListener('click', function () { g.querySelectorAll('[data-v]').forEach(function (x) { x.setAttribute('aria-checked', x === b); x.setAttribute('aria-pressed', x === b); }); fn(b.dataset.v); }); }); }
    wireSeg(w.querySelector('#q-diff'), function (v) { df = +v; });
    wireSeg(w.querySelector('#q-st'), function (v) { st = v; });
    function wireBody() {
      w.querySelectorAll('[id^="q-pic"],[id^="q-pr"]').forEach(function (s) { s.addEventListener('change', function () { var box = s.closest('.pic-opt'); box.querySelector('.b-pic').outerHTML = B.pic(s.value, box.querySelector('.b-pic').getAttribute('width')); }); });
      w.querySelectorAll('input[name="q-ok"]').forEach(function (r) { r.addEventListener('change', function () { w.querySelectorAll('[data-po],[data-o]').forEach(function (x) { x.classList.toggle('ok', x.contains(r)); }); }); });
    }
    wireBody();
    w.querySelectorAll('[data-type]').forEach(function (b) { b.addEventListener('click', function () {
      cur = Object.assign(cur, collect(w, cur)); cur.type = b.dataset.type; cur.ok = null;
      if (cur.type === 'listen' && !cur.pics) cur.pics = ['apple', 'pear', 'orange', 'banana'];
      w.querySelectorAll('[data-type]').forEach(function (x) { x.setAttribute('aria-checked', x === b); });
      w.querySelector('#q-body').innerHTML = body(cur); wireBody();
      if (cur.type === 'listen' || cur.type === 'match') { var lv = w.querySelector('#q-lv'); if (+lv.value > 5) lv.value = '2'; }
    }); });
    w.querySelector('[data-prev]').addEventListener('click', function () { var r = check(w, cur); if (r.first) { var f = w.querySelector(r.first); f && f.focus(); return; } preview(Object.assign({}, cur, r.o)); });
    w.querySelector('[data-qsave]').addEventListener('click', function () {
      var r = check(w, cur); if (r.first) { var f = w.querySelector(r.first); f && f.focus(); return; }
      Object.assign(q, r.o, { diff: df, status: st }); if (!id) { q.id = 'q' + (++uid); QS.unshift(q); }
      dr.close(); CTX.setState('normal'); A.toast(CTX.scr, id ? 'Đã lưu câu hỏi.' : 'Đã thêm câu hỏi (' + (st === 'live' ? 'đã xuất bản' : 'nháp') + ').');
    });
  }
  function page(m) { return A.shell({ area: 'admin', active: 'questions', title: 'Ngân hàng câu hỏi', crumb: '8.633 câu · 128 chưa có giải thích', actions: A.btn({ label: 'Nhập Excel', icon: 'upload', variant: 'secondary' }) + A.btn({ label: 'Thêm câu hỏi', icon: 'plus', attrs: 'data-new' }), main: m }); }
  A.screen({
    labels: { empty: 'Trống (chưa có câu hỏi)' },
    notes: { normal: 'Lọc theo dạng, cấp, kỹ năng, chủ điểm, độ khó, có/thiếu giải thích. Bấm một dòng để sửa: đổi “Dạng câu hỏi” thì phần giữa biểu mẫu đổi theo (Nghe và chọn hình · Nối từ với hình · A/B/C/D · Điền chỗ trống). “Xem như học sinh” mở bản xem trước bằng giao diện Tiểu học hoặc THCS theo cấp.', loading: 'Khung xương bảng câu hỏi.', empty: 'Ngân hàng chưa có câu hỏi.', error: 'Không tải được câu hỏi.' },
    states: {
      normal: function () { return page(table.html()); },
      loading: function () { return page('<section class="a-card">' + B.sk('100%', '36px') + '<div style="height:12px"></div>' + [1, 2, 3, 4, 5, 6, 7].map(function () { return B.sk('100%', '40px') + '<div style="height:8px"></div>'; }).join('') + '</section>'); },
      empty: function () { return page('<section class="a-card">' + A.empty({ title: 'Chưa có câu hỏi nào', text: 'Tạo câu hỏi đầu tiên hoặc nhập từ file Excel mẫu.', action: A.btn({ label: 'Thêm câu hỏi', icon: 'plus', attrs: 'data-new' }) }) + '</section>'); },
      error: function () { return page('<section class="a-card">' + A.error({ code: 'QBK-500' }) + '</section>'); }
    },
    mount: { all: function (scr, ctx) {
      SCR = scr; CTX = ctx;
      if (ctx.state === 'normal') table.mount(scr);
      scr.querySelectorAll('[data-new]').forEach(function (b) { b.addEventListener('click', function () { open(null); }); });
    } }
  });
})();
</script>
</body>
