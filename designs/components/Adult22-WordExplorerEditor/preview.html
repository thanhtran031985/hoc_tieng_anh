      if (!v) { e.hidden = false; e.querySelector('span').textContent = 'Chọn một từ trong kho hoặc bấm “Gõ mới kèm hình”.'; inp.focus(); return; }
      if (!k) { e.hidden = false; e.querySelector('span').textContent = '“' + v + '” chưa có trong kho. Bấm “Gõ mới kèm hình” để thêm.'; inp.focus(); return; }
      sync(); ED.branches[i].ans.push({ k: k, en: EN[k], vi: '' }); redraw('#add-a-' + i); }); });
    el.querySelectorAll('[data-newa]').forEach(function (b) { b.addEventListener('click', function () { var i = +b.dataset.newa; A.dialog(SCR, { title: 'Đáp án mới cho nhánh ' + (i + 1), body: '<div class="a-form" style="text-align:left">' + A.field({ id: 'na-en', label: 'Từ / cụm từ tiếng Anh', required: true, en: true, placeholder: 'ví dụ: worms' }) + A.field({ id: 'na-vi', label: 'Nghĩa tiếng Việt', required: true, placeholder: 'ví dụ: con giun' }) + A.field({ id: 'na-pic', label: 'Hình (PNG/SVG, vuông, ≤ 1 MB)', type: 'file', cls: 'a-full', attrs: 'accept="image/png,image/svg+xml"', hint: 'Chưa có hình thì đáp án vẫn lưu được nhưng có cảnh báo, chưa xuất bản được.' }) + '</div>',
      actions: [{ label: 'Thêm vào nhánh', variant: 'primary', icon: 'plus', onClick: function (w) { var r = { 'na-en': function (v) { return v.trim() ? (/^[A-Za-z ’'-]+$/.test(v.trim()) ? '' : 'Chỉ gồm chữ cái tiếng Anh.') : 'Nhập từ tiếng Anh.'; }, 'na-vi': function (v) { return v.trim() ? '' : 'Nhập nghĩa tiếng Việt.'; } }; if (A.validate(w, r)) return false; sync(); var en = w.querySelector('#na-en').value.trim(); MISSING[en] = { pic: !w.querySelector('#na-pic').value, audio: true }; ED.branches[i].ans.push({ k: en, en: en, vi: w.querySelector('#na-vi').value.trim() }); redraw('#add-a-' + i); } }, { label: 'Huỷ', variant: 'secondary' }] }); }); });
    var ab = el.querySelector('[data-addbr]'); ab && ab.addEventListener('click', function () { sync(); var t = TPL[ED.group][ED.branches.length] || ['', '']; ED.branches.push({ q: t[0].replace('{w}', 'bird'), qvi: t[1].replace('{v}', 'Chim'), ans: [], nz: [] }); ED.open = ED.branches.length - 1; redraw('#q-en-' + ED.open); });
    el.querySelector('[data-fill]').addEventListener('click', function () { sync(); ED.group = el.querySelector('#tpl').value; var t = TPL[ED.group]; ED.branches.forEach(function (b, i) { if (t[i]) { b.q = t[i][0].replace('{w}', 'bird'); b.qvi = t[i][1].replace('{v}', 'Chim'); } }); redraw('[data-fill]'); A.toast(SCR, 'Đã điền ' + Math.min(t.length, ED.branches.length) + ' câu hỏi mẫu nhóm “' + GROUPS.filter(function (g) { return g[0] === ED.group; })[0][1] + '”.'); });
    el.querySelector('[data-join]').addEventListener('click', function () { sync(); var d = W.wx.bird; ED.sents = ED.branches.map(function (b, i) { var o = d.branches.filter(function (x) { return x.q === b.q; })[0]; var old = ED.sents[i] || {}; return { en: o ? o.sent[0] : 'It ' + b.ans.map(function (a) { return a.en; }).join(', ') + '.', vi: o && old.vi ? old.vi : (o ? (i === 4 ? '' : o.sent[1]) : '') }; }); redraw('[data-join]'); A.toast(SCR, 'Đã ghép ' + ED.sents.length + ' câu từ các câu trả lời. Kiểm tra bản dịch nhé.'); });
    var tts = el.querySelector('[data-tts]'); tts && tts.addEventListener('click', function () { ED.audio = 'gen'; redraw(); var n = 40; var t = setInterval(function () { n += 20; var bar = dr.el.querySelector('[data-audiorow] .bar'); if (bar) { bar.setAttribute('aria-valuenow', n); bar.firstChild.style.width = n + '%'; } if (n >= 100) { clearInterval(t); ED.audio = 'done'; redraw('[data-audiorow] button'); A.toast(SCR, 'Đã tạo giọng đọc cho đoạn văn.'); } }, 350); });
    el.querySelectorAll('[data-goto]').forEach(function (b) { b.addEventListener('click', function () { var sel = b.dataset.goto, m = sel.match(/^#br-(\d+)/); if (m) { sync(); ED.open = +m[1]; redraw(null, false); } var t = el.querySelector(sel); if (t) { scrollDrawer(t); var f = t.matches('input,button') ? t : t.querySelector('input, button'); f && f.focus({ preventScroll: true }); } }); });
    el.querySelectorAll('[data-etab]').forEach(function (b) { b.addEventListener('click', function () { if (b.dataset.etab === 'info') A.toast(SCR, 'Tab “Thẻ từ” là biểu mẫu cũ của Ngân hàng từ vựng (giữ nguyên).'); }); b.addEventListener('keydown', function (e) { if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); var o = el.querySelector('[data-etab]:not([data-etab="' + b.dataset.etab + '"])'); o.focus(); } }); });
  }
  function student() {
    sync(); var d = JSON.parse(JSON.stringify(W.wx.bird)); d.branches = ED.branches.map(function (b) { var o = d.branches.filter(function (x) { return x.q === b.q; })[0] || d.branches[0]; return Object.assign({}, o, { q: b.q, qvi: b.qvi, ans: b.ans.map(function (a) { return [MISSING[a.k] && MISSING[a.k].pic ? '' : a.k, a.en, a.vi]; }) }); });
    var keep = W.wx.__prev; W.wx.__prev = d; var html = W.explorer('__prev', { open: d.branches.map(function () { return true; }), compact: true });
    A.dialog(SCR, { title: 'Xem như học sinh · Khám phá từ “bird” (giao diện Tiểu học)', wide: 1080, body: '<div class="a-stu-wx" data-theme="tieu-hoc">' + html + '</div><p class="adm-small" style="margin:8px 0 0;text-align:left">Bản xem trước: mọi nhánh đã mở. Bé thật sẽ mở từng nhánh bằng cách chọn hình; đáp án chưa có hình hiện tạm hình trống. Bấm đáp án để nghe.</p>', actions: [{ label: 'Đóng', variant: 'primary' }], onOpen: function (w) { requestAnimationFrame(function () { W.lines(w); }); } });
  }
  function open(state) {
    if (state === 'errors') { ED.status = 'live'; ED.showErr = true; }
    dr = A.drawer(SCR, { wide: true, title: 'Sửa từ “bird” · Khám phá', body: body(), foot: foot() });
    wire();
    var seg = dr.el.querySelector('[data-st]'); seg.querySelectorAll('[data-v]').forEach(function (b) { b.addEventListener('click', function () { seg.querySelectorAll('[data-v]').forEach(function (x) { x.setAttribute('aria-checked', x === b); x.setAttribute('aria-pressed', x === b); }); ED.status = b.dataset.v; }); });
    dr.el.querySelector('[data-stu]').addEventListener('click', student);
    dr.el.querySelector('[data-save]').addEventListener('click', function () { sync(); var bad = A.validate(dr.el, ED.status === 'live' ? rules() : Object.keys(rules()).filter(function (k) { return k.indexOf('s-vi') < 0; }).reduce(function (o, k) { o[k] = rules()[k]; return o; }, {})); unscroll(); if (bad) return;
      var w = warns(); if (ED.status === 'live' && w.length) { A.dialog(SCR, { title: 'Chưa xuất bản được', body: 'Còn ' + w.length + ' mục cần bổ sung: ' + w.map(function (x) { return x[0]; }).join('; ') + '. Lưu thành Nháp để làm tiếp sau?', actions: [{ label: 'Lưu thành Nháp', variant: 'primary', onClick: function () { ED.status = 'draft'; dr.close(); A.toast(SCR, 'Đã lưu Khám phá “bird” ở trạng thái Nháp.'); } }, { label: 'Ở lại sửa', variant: 'secondary' }] }); return; }
      dr.close(); A.toast(SCR, ED.status === 'live' ? 'Đã xuất bản Khám phá “bird”.' : 'Đã lưu Khám phá “bird” (Nháp, ' + w.length + ' cảnh báo).'); });
    if (state === 'paragraph') setTimeout(function () { var s = dr.el.querySelector('#sec-para'); s && scrollDrawer(s); var f = dr.el.querySelector('#s-vi-4'); f && f.focus({ preventScroll: true }); unscroll(); }, 80);
    if (state === 'errors') setTimeout(function () { A.validate(dr.el, rules()); unscroll(); }, 80);
  }
  var ROWS = [['bird', 'con chim', 2, 'Con vật', '6 nhánh', 'draft'], ['cat', 'con mèo', 1, 'Con vật', '5 nhánh', 'live'], ['shirt', 'áo sơ mi', 3, 'Quần áo', '4 nhánh', 'live'], ['dog', 'con chó', 1, 'Con vật', '', 'live'], ['fish', 'con cá', 1, 'Con vật', '', 'live'], ['duck', 'con vịt', 1, 'Con vật', '', 'live'], ['apple', 'quả táo', 1, 'Trái cây', '', 'live'], ['banana', 'quả chuối', 1, 'Trái cây', '', 'live'], ['kite', 'cái diều', 2, 'Đồ chơi', '', 'live'], ['ball', 'quả bóng', 1, 'Đồ chơi', '', 'live']]
    .map(function (r, i) { return { id: 'w' + i, k: r[0], vi: r[1], lv: r[2], topic: r[3], wx: r[4], status: r[5] }; });
  var TABLE = A.table({ id: 't-vocab', rows: ROWS, pageSize: 8, searchKeys: ['k', 'vi'], placeholder: 'Tìm từ…', sort: { key: 'k', dir: 'asc' }, filters: [{ key: 'wx', label: 'Khám phá', options: [['has', 'Đã có'], ['none', 'Chưa có']], match: function (r, v) { return v === 'has' ? !!r.wx : !r.wx; } }],
    columns: [{ key: 'k', label: 'Hình', render: function (x) { return '<span class="th">' + W.pic(x.k, 32) + '</span>'; } }, { key: 'k', label: 'Từ', sort: true, render: function (x) { return '<span class="nm"><b lang="en">' + x.k + '</b><small>' + x.vi + '</small></span>'; } }, { key: 'lv', label: 'Cấp', sort: true }, { key: 'topic', label: 'Chủ đề', sort: true },
      { key: 'wx', label: 'Khám phá', sort: true, render: function (x) { return x.wx ? A.status(x.status === 'live' ? 'live' : 'draft', x.wx + (x.status === 'live' ? '' : ' · nháp')) : A.status('none', 'Chưa có'); } }],
    actions: function (x) { return A.btn({ label: x.wx ? 'Sửa Khám phá' : 'Thêm Khám phá', variant: 'ghost', size: 's', icon: 'branch', attrs: 'data-edit="' + x.k + '"' }); } });
  function page(m) { return A.shell3({ area: 'admin', active: 'vocab', title: 'Ngân hàng từ vựng', crumb: 'Từ vựng · tab mới “Khám phá” trong biểu mẫu từ', actions: A.btn({ label: 'Thêm từ', icon: 'plus' }), main: m }); }
  A.screen({
    order: ['normal', 'paragraph', 'errors', 'loading', 'empty', 'error'], labels: { normal: 'Ngăn kéo · Nhánh', paragraph: 'Đoạn văn', errors: 'Bấm Lưu khi Xuất bản' },
    notes: {
      normal: 'Bấm “Sửa Khám phá” ở một từ → ngăn kéo rộng, tab “Khám phá”. Cảnh báo ở đầu (bấm để nhảy tới chỗ cần sửa). Bộ câu hỏi mẫu theo nhóm (Con vật, Đồ ăn, Đồ vật, Nghề nghiệp, Nơi chốn) → “Điền sẵn câu hỏi”. 4–6 nhánh: kéo tay nắm hoặc ↑ ↓ trên tay nắm để sắp xếp, mở/thu từng nhánh, xoá qua hộp thoại (ít nhất 4). Mỗi nhánh: câu hỏi Anh + Việt, đáp án (chọn từ kho hoặc “Gõ mới kèm hình”), hình nhiễu. Đáp án thiếu hình / âm thanh có dấu cảnh báo cam.',
      paragraph: 'Đoạn văn: “Ghép đoạn từ các câu trả lời”, mỗi câu Anh kèm ô dịch Việt; câu 5 chưa có bản dịch. “Tạo giọng đọc tự động” có thanh tiến trình rồi nút Nghe.',
      errors: 'Chọn Xuất bản rồi Lưu: lỗi hiện ngay dưới ô (câu chưa có bản dịch), cảnh báo còn lại chặn xuất bản kèm lý do và gợi ý lưu Nháp. Báo lỗi cả khi rời ô.',
      loading: 'Khung xương bảng từ vựng.', empty: 'Ngân hàng từ vựng trống.', error: 'Không tải được ngân hàng từ vựng.' },
    states: {
      normal: function () { return page(TABLE.html()); }, paragraph: function () { return page(TABLE.html()); }, errors: function () { return page(TABLE.html()); },
      loading: function () { return page(A.skel('420px')); },
      empty: function () { return page('<section class="a-card">' + A.empty({ title: 'Chưa có từ nào trong kho', text: 'Thêm từ trước, rồi mở tab “Khám phá” để soạn câu hỏi quanh từ đó.', action: A.btn({ label: 'Thêm từ', icon: 'plus' }) }) + '</section>'); },
      error: function () { return page('<section class="a-card">' + A.error({ code: 'VOC-500' }) + '</section>'); }
    },
    mount: { all: function (scr, ctx) {
      SCR = scr; CTX = ctx;
      if (['normal', 'paragraph', 'errors'].indexOf(ctx.state) < 0) return;
      ED = fresh(); TABLE.mount(scr, bind); bind();
      function bind() { scr.querySelectorAll('[data-edit]').forEach(function (b) { b.onclick = function () { if (b.dataset.edit === 'bird') open(); else A.toast(scr, 'Bản xem trước chỉ soạn sẵn cho “bird”.'); }; }); }
      open(ctx.state);
    } }
  });
})();
