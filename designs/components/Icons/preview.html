<!-- @dsCard group="Chung · Hiển thị" height=260 subtitle="Bộ icon nét tròn 24px (2.4px) và icon màu thưởng" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Icon — preview</title>
<style> body { background: var(--bg); padding: 8px; } .g { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; } .i { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 4px; background: var(--surface); border-radius: var(--radius-md); color: var(--ink); font: 700 12px/14px var(--font-body); } .i span { color: var(--ink-soft); } </style></head>
<body><div class="g" id="g"></div>
<script>
  var B = window.Bong;
  var n = ['speaker','replay','bulb','check','close','back','next','flip','lock','plus','mic','map','book','gem','house','user','gear','moon','eye','wifi','crown','clock','pause','play','keyboard','star','starEmpty','coin','flame'];
  document.getElementById('g').innerHTML = n.map(function (k) { return '<div class="i">' + B.icon(k, 32) + '<span>' + k + '</span></div>'; }).join('');
</script></body></html>
