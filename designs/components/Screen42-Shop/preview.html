<!-- @dsCard group="Màn Tiểu học · 37–39 Phòng của tớ" height=700 subtitle="38. Cửa hàng (Screen42-Shop): 3 nhóm Nội thất, Quần áo, Mũ; thẻ món đồ có hình, tên tiếng Anh + loa, giá xu hoặc “Đã có”; hộp thoại xác nhận mua; không đủ xu thì nút mờ, Bông nói còn thiếu bao nhiêu xu và gợi ý học thêm một bài. Không có tiền thật, không quảng cáo" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Cửa hàng — preview</title>
<style>
  .bar { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); padding: 0 0 var(--space-3); }
  .bar h1 { margin: 0; }
  .tabs { display: inline-flex; background: var(--surface-sunk); border-radius: var(--radius-pill); padding: 5px; gap: 4px; }
  .tabs button { height: 48px; border: 0; background: none; border-radius: var(--radius-pill); padding: 0 var(--space-5); font: 800 18px/22px var(--font-body); color: var(--ink-soft); cursor: pointer; display: inline-flex; align-items: center; gap: var(--space-2); }
  .tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-card); }
  .tabs .n { font-size: 14px; }
  .wrap { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 250px; gap: var(--space-5); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: var(--space-4); min-height: 0; }
  .card { background: var(--surface); border-radius: var(--radius-xl); box-shadow: var(--shadow-card); padding: var(--space-3) var(--space-3) var(--space-4); display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; position: relative; }
  .card .art { height: min(96px, 11cqh); display: grid; place-items: center; }
  .card .art .b-pic { width: min(96px, 11cqh); height: auto; }
  .card .art .b-dragon { width: min(100px, 11.5cqh); height: auto; }
  .card .nm { display: flex; align-items: center; gap: 6px; }
  .card .nm b { font: 800 21px/26px var(--font-display); color: var(--ink); }
  .card .vi { font: 700 14px/18px var(--font-body); color: var(--ink-soft); }
  .card .act { margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 6px; padding-top: 6px; }
  .card .short { font: 800 13px/16px var(--font-body); color: var(--ink-soft); }
  .card.is-own { background: var(--surface-soft); }
  .buy[aria-disabled="true"] { --face: var(--surface-sunk); --lip: var(--star-empty); --txt: var(--ink-soft); cursor: not-allowed; }
  .side { background: var(--surface); border-radius: var(--radius-xl); box-shadow: var(--shadow-card); padding: var(--space-4); display: flex; flex-direction: column; align-items: center; gap: var(--space-3); text-align: center; }
  .side .b-dragon { width: 160px; height: auto; }
  .side .msg { background: var(--surface-soft); border-radius: var(--radius-lg); padding: var(--space-3); font: 700 16px/22px var(--font-body); color: var(--ink); }
  .side .rule { font: 700 13px/18px var(--font-body); color: var(--ink-soft); margin-top: auto; display: flex; gap: 6px; align-items: flex-start; text-align: left; }
  .cf { display: flex; flex-direction: column; align-items: center; gap: var(--space-3); }
  .cf .row { display: flex; align-items: center; gap: var(--space-3); font: 800 18px/24px var(--font-body); color: var(--ink); }
  .cf .art { width: 120px; height: 120px; display: grid; place-items: center; background: var(--surface-soft); border-radius: var(--radius-lg); }
  .cf .art .b-dragon, .cf .art .b-pic { width: 100px; height: auto; }
</style></head>
<body>
<div id="root"></div>
<script>
(function () {
  var B = window.Bong, R = B.R, W = R.roomWords;
  var kid = { id: 'minh', name: 'Minh', grade: 4, level: 3, hair: 'short' };
  var CAT = [{ id: 'furn', vi: 'Nội thất', icon: 'house' }, { id: 'clothes', vi: 'Quần áo', icon: 'shirt' }, { id: 'hats', vi: 'Mũ', icon: 'crown' }];
  var ITEMS = {
    furn: [['lamp', 'lamp', 80, 1], ['bookshelf', 'bookshelf', 150, 1], ['bed', 'bed', 150, 1], ['chair', 'chair', 80, 1], ['globe', 'globe', 80, 0], ['guitar', 'guitar', 80, 0], ['sofa', 'sofa', 150, 0], ['fishtank', 'fish tank', 400, 0]],
    clothes: [['tee', 'T-shirt', 60, 1, 'áo phông'], ['stripe', 'striped shirt', 60, 1, 'áo sọc'], ['raincoat', 'raincoat', 60, 0, 'áo mưa']],
    hats: [['cap', 'cap', 50, 1, 'mũ lưỡi trai'], ['sunhat', 'sun hat', 50, 1, 'mũ rơm'], ['beanie', 'beanie', 50, 0, 'mũ len']]
  };
  var S = { cat: 'furn', coins: 340, msg: null };
  function vi(c, it) { return it[4] || W[it[0]]; }
  function art(c, it, size) { return c === 'furn' ? B.pic(it[0], size).replace(/role="img"[^>]*?aria-label="[^"]*"/, 'aria-hidden="true"') : B.dragon('chao', size, c === 'hats' ? { hat: it[0] } : { top: it[0] }).replace(/role="img"[^>]*?aria-label="[^"]*"/, 'aria-hidden="true"'); }
  function card(it, i) {
    var own = it[3], short = it[2] - S.coins;
    return '<article class="card' + (own ? ' is-own' : '') + '" aria-labelledby="it-' + i + '"><div class="art">' + art(S.cat, it, 100) + '</div><div class="nm">' + B.speak(it[1], 's', 'Nghe: ' + it[1]) + '<b lang="en" id="it-' + i + '">' + it[1] + '</b></div><span class="vi">' + vi(S.cat, it) + '</span><div class="act">' +
      (own ? '<span class="b-owned">' + B.icon('check', 18) + 'Đã có</span>' : '<span class="b-price">' + B.icon('coin', 22) + it[2] + '<span class="b-sr"> xu</span></span>' + B.btn({ label: 'Mua', size: 's', variant: short > 0 ? 'secondary' : 'primary', cls: 'buy', attrs: 'data-buy="' + i + '"' + (short > 0 ? ' aria-disabled="true" aria-describedby="sh-' + i + '"' : '') }) + (short > 0 ? '<span class="short" id="sh-' + i + '">Còn thiếu ' + short + ' xu</span>' : '')) + '</div></article>';
  }
  function side(off) { var m = S.msg || 'Chọn món cậu thích nhé! Xu có được khi học bài, nhận huy hiệu và thắng trùm.';
    return '<aside class="side">' + B.dragon(S.msg && S.msg.indexOf('thiếu') > -1 ? 'dongvien' : 'chao', 160, { top: 'tee', hat: 'cap' }) + '<p class="msg" aria-live="polite" data-msg>' + m + '</p>' + (S.msg && S.msg.indexOf('thiếu') > -1 ? B.btn({ label: 'Học một bài', icon: 'map', size: 'm', attrs: 'data-learn' }) : '') + '<p class="rule">' + B.icon('lock', 16) + '<span>Xu chỉ dùng trong Học cùng Bông. Không có mua bằng tiền thật, không có quảng cáo.</span></p></aside>'; }
  function top(c) { return B.topbar({ back: true, backLabel: 'Về Phòng của tớ', kid: kid, stats: false, right: B.stat('coins', c == null ? S.coins : c, 'xu') + B.btn({ label: 'Phòng của tớ', icon: 'house', size: 'm', variant: 'secondary' }) }); }
  function bar(off) { return '<div class="bar"><h1 class="display-l">Cửa hàng</h1><div class="tabs" role="tablist" aria-label="Nhóm đồ">' + CAT.map(function (c) { return '<button type="button" role="tab" data-cat="' + c.id + '" aria-selected="' + (S.cat === c.id) + '"' + (off ? ' disabled' : '') + '>' + B.icon(c.icon, 20) + c.vi + '<span class="n">' + ITEMS[c.id].length + '</span></button>'; }).join('') + '</div></div>'; }
  function page() { return top() + '<div class="scr__body">' + bar() + '<div class="wrap"><div class="grid" role="list">' + ITEMS[S.cat].map(function (it, i) { return '<div role="listitem" style="display:contents">' + card(it, i) + '</div>'; }).join('') + '</div>' + side() + '</div></div>'; }
  B.screen({
    fit: true, level: 3,
    notes: { normal: 'Tab Nội thất / Quần áo / Mũ. Thẻ: hình (quần áo, mũ: Bông mặc thử), tên tiếng Anh + loa, nghĩa, giá (`price-chip`, `price-furniture-*`, `price-special`) hoặc “Đã có” (`owned-chip`). Mua → hộp thoại xác nhận (xu trước → sau). Không đủ xu: nút mờ + “Còn thiếu 60 xu”; bấm vào, Bông nói còn thiếu bao nhiêu và gợi ý “Học một bài”.', loading: 'Khung xương thẻ món đồ.', empty: 'Nhóm đồ chưa có món nào.', error: 'Không tải được cửa hàng.' },
    states: {
      normal: page,
      loading: function () { var g = ''; for (var i = 0; i < 8; i++) g += '<div class="card">' + B.sk('96px', '96px', 'var(--radius-lg)') + B.sk('70%', '24px', 'var(--radius-pill)') + B.sk('50%', '16px', 'var(--radius-pill)') + B.sk('60%', '36px', 'var(--radius-pill)') + '</div>'; return top('··') + '<div class="scr__body">' + bar(true) + '<div class="wrap"><div class="grid">' + g + '</div><aside class="side">' + B.sk('160px', '170px', '50%') + B.sk('100%', '80px', 'var(--radius-lg)') + '</aside></div></div>'; },
      empty: function () { return top() + '<div class="scr__body">' + bar() + '<div class="wrap">' + B.stateBlock({ kind: 'empty', title: 'Kệ hàng đang trống', text: 'Bông đang nhập đồ mới về. Cậu ghé lại sau nhé!', action: B.btn({ label: 'Về Phòng của tớ', icon: 'house', size: 'l' }) }) + side() + '</div></div>'; },
      error: function () { return top() + '<div class="scr__body">' + bar(true) + B.stateBlock({ kind: 'error', title: 'Cửa hàng chưa mở cửa', text: 'Xu của cậu vẫn còn nguyên. Mình thử lại nhé!' }) + '</div>'; }
    },
    mount: { all: function (scr, ctx) {
      if (ctx.state !== 'normal' && ctx.state !== 'empty') return;
      function re(sel) { ctx.setState(ctx.state); var f = sel && ctx.scr.querySelector(sel); f && f.focus({ preventScroll: true }); }
      scr.querySelectorAll('[data-cat]').forEach(function (b) { b.addEventListener('click', function () { S.cat = b.dataset.cat; S.msg = null; re('[data-cat="' + S.cat + '"]'); }); b.addEventListener('keydown', function (e) { if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { e.preventDefault(); var ids = CAT.map(function (c) { return c.id; }), i = ids.indexOf(S.cat); S.cat = ids[(i + (e.key === 'ArrowRight' ? 1 : 2)) % 3]; S.msg = null; re('[data-cat="' + S.cat + '"]'); } }); });
      scr.querySelectorAll('[data-buy]').forEach(function (b) { b.addEventListener('click', function () {
        var i = +b.dataset.buy, it = ITEMS[S.cat][i], short = it[2] - S.coins;
        if (short > 0) { S.msg = 'Cậu còn thiếu <b>' + short + ' xu</b> để mua <b lang="en">' + it[1] + '</b>. Học thêm một bài (+20 xu, 3 sao +30) là gần đủ rồi!'; re('[data-buy="' + i + '"]'); return; }
        ctx.dialog({ mascot: '<div class="b-dialog__mascot">' + B.dragon('vui', 120) + '</div>', title: 'Mua ' + it[1] + '?', body: '<div class="cf"><div class="art">' + art(S.cat, it, 100) + '</div><span class="row"><span class="b-price">' + B.icon('coin', 22) + S.coins + '</span>' + B.icon('next', 20) + '<span class="b-price">' + B.icon('coin', 22) + (S.coins - it[2]) + '</span></span><span class="body b-muted">' + vi(S.cat, it) + ' · giá ' + it[2] + ' xu. Món mới sẽ vào ' + (S.cat === 'furn' ? 'Kho đồ' : 'Tủ đồ') + ' trong Phòng của tớ.</span></div>',
          actions: [{ label: 'Mua', variant: 'primary', key: 'Enter', onClick: function () { S.coins -= it[2]; it[3] = 1; S.msg = 'Tuyệt! <b lang="en">' + it[1] + '</b> đã vào ' + (S.cat === 'furn' ? 'Kho đồ' : 'Tủ đồ') + '. Cậu còn ' + S.coins + ' xu.'; ctx.later(function () { re('[data-cat="' + S.cat + '"]'); ctx.burst(ctx.scr.querySelector('[data-stat="coins"]'), null, 8, 'coin'); B.L.say(it[1], .85); }, 220); } }, { label: 'Để sau', variant: 'secondary' }] });
      }); });
      var lr = scr.querySelector('[data-learn]'); lr && lr.addEventListener('click', function () { ctx.burst(lr); });
    } }
  });
})();
</script>
</body>
</html>
