<!-- @dsCard group="Linh vật" height=430 subtitle="Rồng Bông — 6 biểu cảm và 4 màu để bé chọn" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Rồng Bông — preview</title>
<style>
  .row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; padding: 8px 4px 0; }
  .cell { background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); padding: 18px 8px 12px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .cell svg { width: 100%; max-width: 150px; height: auto; }
  .nm { font: 800 16px/20px var(--font-body); color: var(--ink); }
  .use { font: 600 13px/17px var(--font-body); color: var(--ink-soft); text-align: center; }
  .vars { display: flex; gap: 16px; padding: 18px 4px 4px; align-items: end; flex-wrap: wrap; }
  .v { display: flex; flex-direction: column; align-items: center; gap: 4px; font: 800 14px/18px var(--font-body); color: var(--ink); }
  body { background: var(--bg); padding: 8px; }
</style></head>
<body>
<div class="row" id="row"></div>
<div class="vars" id="vars"></div>
<script>
  var B = window.Bong;
  var list = [['chao','Chào','Trang chủ, đăng nhập, mở đầu bài'],['vui','Vui mừng','Trả lời đúng (dải phản hồi xanh)'],['dongvien','Động viên','Chưa đúng, lỗi tải — luôn kèm "thử lại"'],['suynghi','Suy nghĩ','Đang tải, trạng thái trống, gợi ý'],['ngu','Ngủ','Hết giờ học, tạm nghỉ'],['chucmung','Chúc mừng','Kết thúc bài, qua cấp, thắng trùm']];
  document.getElementById('row').innerHTML = list.map(function (x) { return '<div class="cell">' + B.dragon(x[0], 150) + '<div class="nm">' + x[1] + '</div><div class="use">' + x[2] + '</div></div>'; }).join('');
  document.getElementById('vars').innerHTML = [['dragon-ngoc','Rồng Ngọc (mặc định)'],['dragon-dao','Rồng Đào'],['dragon-nang','Rồng Nắng'],['dragon-tim','Rồng Tím']].map(function (v) { return '<div class="v ' + v[0] + '">' + B.dragon('chao', 96) + v[1] + '</div>'; }).join('');
</script>
</body>
</html>
