<!-- @dsCard group="Màn Tiểu học · 44–49 Khám phá từ, Họ vần, Ghép chữ" height=700 subtitle="49b. Một lượt đi qua các liên kết (Screen53-WordJourney): bird → họ -ir → Ghép chữ đầu → shirt → Khám phá shirt, trình bày thành 4 khung nối nhau; mỗi khung là màn thật thu nhỏ với nút được bấm sáng lên và đường dẫn ở dải liên kết; bấm một khung để thử bước đó" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Một lượt đi qua liên kết — preview</title>
<style>
  .jr { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 14px 40px 18px; box-sizing: border-box; gap: 10px; }
  .jr__h { display: flex; align-items: center; gap: 12px; }
  .jr__h h1 { margin: 0; } .jr__h p { margin: 0 0 0 auto; font: 700 15px/20px var(--font-body); color: var(--ink-soft); }
  .jr__grid { flex: 1; min-height: 0; display: grid; grid-template-columns: auto 64px auto; grid-template-rows: auto 40px auto; justify-content: center; align-content: center; }
  .jf { --k: .355; display: flex; flex-direction: column; gap: 6px; border-radius: var(--radius-lg); padding: 8px; background: var(--surface); box-shadow: var(--shadow-card); cursor: pointer; border: 3px solid transparent; }
  .jf:hover { border-color: var(--links-line); }
  .jf__cap { display: flex; align-items: flex-start; gap: 8px; font: 700 15px/19px var(--font-body); color: var(--ink); max-width: calc(1366px * var(--k)); }
  .jf__n { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--brand); color: var(--on-brand); display: grid; place-items: center; font: 800 15px/1 var(--font-body); }
  .jf__vp { width: calc(1366px * var(--k)); height: calc(768px * var(--k)); overflow: hidden; border-radius: 10px; box-shadow: inset 0 0 0 2px var(--line); position: relative; background: var(--bg); }
  .jf__scr { position: absolute; left: 0; top: 0; width: 1366px; height: 768px; transform: scale(var(--k)); transform-origin: 0 0; container-type: size; pointer-events: none; }
  .ja { display: grid; place-items: center; color: var(--brand); }
  .ja .b-ico { width: 40px; height: 40px; }
  .ja--down .b-ico { transform: rotate(90deg); } .ja--left .b-ico { transform: rotate(180deg); }
  .jf--1 { grid-column: 1; grid-row: 1; } .ja--1 { grid-column: 2; grid-row: 1; } .jf--2 { grid-column: 3; grid-row: 1; }
  .ja--2 { grid-column: 3; grid-row: 2; } .jf--3 { grid-column: 3; grid-row: 3; } .ja--3 { grid-column: 2; grid-row: 3; } .jf--4 { grid-column: 1; grid-row: 3; }
  .jf .is-glow, .jf [data-wback].is-glow { box-shadow: 0 0 0 12px var(--read-highlight) !important; border-color: var(--brand) !important; }
  .jsk { display: flex; flex-direction: column; gap: 8px; padding: 8px; background: var(--surface); border-radius: var(--radius-lg); }
</style></head>
<body>
<div id="root"></div>
<script>
(function () {
  var B = window.Bong, W = B.W;
  var ALL6 = [true, true, true, true, true, true];
  var STEPS = [
    { stack: [{ v: 'wx', k: 'bird', open: ALL6 }], cap: '<b lang="en">bird</b> · Khám phá từ — bấm “Họ vần của bird: -ir”', glow: '[data-wl-fam]' },
    { stack: [{ v: 'wx', k: 'bird', open: ALL6 }, { v: 'fam', k: 'ir', hl: 'bird' }], cap: 'Họ vần -ir — <b lang="en">bird</b> được tô sáng; bấm “Ghép” trên thẻ <b lang="en">shirt</b>', glow: '[data-fbuild="shirt"]' },
    { stack: [{ v: 'wx', k: 'bird', open: ALL6 }, { v: 'fam', k: 'ir', hl: 'bird' }, { v: 'build', k: 'irt', found: ['shirt'], slot: 'sh', state: 'ok' }], cap: 'Ghép chữ đầu — sh + irt = <b lang="en">shirt</b>; bấm <b lang="en">shirt</b> trong “Đã tìm được”', glow: '[data-fopen="shirt"]' },
    { stack: [{ v: 'wx', k: 'bird', open: ALL6 }, { v: 'fam', k: 'ir', hl: 'bird' }, { v: 'build', k: 'irt', found: ['shirt'] }, { v: 'wx', k: 'shirt', open: [true, true] }], cap: '<b lang="en">shirt</b> · Khám phá từ — đường dẫn đủ 4 bậc; Quay lại (Backspace) về Ghép chữ', glow: '[data-wback]' }
  ];
  function frame(s, i) {
    var st = s.stack.map(function (e) { var x = W.entry(JSON.parse(JSON.stringify(e))); x.mode = 'explore'; return x; });
    return '<div class="jf jf--' + (i + 1) + '" role="button" tabindex="0" data-step="' + i + '" aria-label="Bước ' + (i + 1) + ': ' + s.cap.replace(/<[^>]+>/g, '') + '. Bấm để thử bước này."><div class="jf__cap"><span class="jf__n" aria-hidden="true">' + (i + 1) + '</span><span>' + s.cap + '</span></div>' +
      '<div class="jf__vp"><div class="jf__scr scr" data-level="2" data-jscale=".355" inert aria-hidden="true"><div class="b-wl">' + W.frame(st, 'explore') + '</div></div></div></div>';
  }
  function arrows() { return '<span class="ja ja--1" aria-hidden="true">' + B.icon('next', 40) + '</span><span class="ja ja--2 ja--down" aria-hidden="true">' + B.icon('next', 40) + '</span><span class="ja ja--3 ja--left" aria-hidden="true">' + B.icon('next', 40) + '</span>'; }
  function head(extra) { return '<div class="jr__h"><h1 class="title">Một lượt đi: bird → họ -ir → Ghép chữ đầu → shirt</h1><p>' + (extra || 'Bấm một khung (Enter) để thử bước đó · ← → chọn khung') + '</p></div>'; }
  function page() { return '<div class="jr">' + head() + '<div class="jr__grid">' + STEPS.map(frame).join('') + arrows() + '</div></div>'; }
  function skel() { return '<div class="jr">' + head(' ') + '<div class="jr__grid">' + [1, 2, 3, 4].map(function (i) { return '<div class="jsk jf--' + i + '">' + B.sk('300px', '20px', 'var(--radius-pill)') + B.sk('485px', '273px', '10px') + '</div>'; }).join('') + '</div></div>'; }
  B.screen({
    fit: true, level: 2,
    notes: { normal: 'Bốn khung là màn thật (chế độ tự khám phá) thu nhỏ, nối bằng mũi tên: 1 Khám phá bird → 2 Họ vần -ir (bird tô sáng) → 3 Ghép chữ đầu (shirt) → 4 Khám phá shirt. Nút được bấm ở mỗi bước có viền sáng `read-highlight`; dải liên kết (`links-bg`) cho thấy đường dẫn dài dần tới 4 bậc. Enter hoặc bấm khung: mở bước đó ở cỡ thật để thử, Đóng (Esc) quay lại lượt đi. Trong khung bài học các liên kết này ẩn.', loading: 'Khung xương 4 bước.', empty: 'Chưa có lượt đi nào để xem.', error: 'Không tải được lượt đi.' },
    states: {
      normal: page, loading: skel,
      empty: function () { return '<div class="jr">' + head(' ') + B.stateBlock({ kind: 'empty', title: 'Chưa có lượt đi nào', text: 'Mở một từ trong Sổ từ rồi bấm các liên kết để bắt đầu lượt đi đầu tiên nhé!', action: B.btn({ label: 'Mở Sổ từ', icon: 'book', size: 'l' }) }) + '</div>'; },
      error: function () { return '<div class="jr">' + head(' ') + B.stateBlock({ kind: 'error', title: 'Chưa tải được lượt đi', text: 'Mạng chập chờn một chút. Không phải lỗi của cậu đâu!' }) + '</div>'; }
    },
    mount: { normal: function (scr, ctx) {
      function wire() {
        var fs = Array.prototype.slice.call(scr.querySelectorAll('.jf'));
        requestAnimationFrame(function () { fs.forEach(function (f, i) { var inner = f.querySelector('.jf__scr'); W.lines(inner); W.famLines(inner); var g = inner.querySelector(STEPS[i].glow); g && g.classList.add('is-glow'); if (g && g.matches('[data-wback], .b-crumb')) g.style.boxShadow = '0 0 0 5px var(--read-highlight)'; }); });
        fs.forEach(function (f, i) {
          f.addEventListener('click', function () { open(i); });
          f.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(i); } if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { e.preventDefault(); fs[(i + (e.key === 'ArrowRight' ? 1 : 3)) % 4].focus(); } });
        });
      }
      function open(i) {
        var j = scr.querySelector('.jr'); j.outerHTML = '<div class="b-wl" data-wapp></div>';
        W.app(scr.querySelector('[data-wapp]'), ctx, { mode: 'explore', stack: JSON.parse(JSON.stringify(STEPS[i].stack)), onClose: function () { scr.querySelector('[data-wapp]').outerHTML = page(); wire(); scr.querySelector('[data-step="' + i + '"]').focus(); } });
      }
      wire(); scr.querySelector('.jf').focus({ preventScroll: true });
    } }
  });
})();
</script>
</body>
</html>
