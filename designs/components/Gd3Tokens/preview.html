<!-- @dsCard group="Chung · Màu" height=760 subtitle="Token bổ sung đợt 5B: album & sticker, huy hiệu, hộp quà, phòng của tớ, cửa hàng & giá xu, đồ cho Bông, chuỗi ngày, bản in, học tập trung, vườn ngoài giờ, khu người lớn; cỡ mới và họ token Xu" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Token bổ sung đợt 5B — preview</title>
<style>
  body { margin: 0; background: var(--bg); }
  .p { padding: var(--space-3) var(--space-4); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--space-3); }
  section { background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); padding: var(--space-2) var(--space-3); display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  h3 { margin: 0; font: 800 16px/20px var(--font-display); color: var(--ink); }
  .sw { display: flex; flex-wrap: wrap; gap: 4px 8px; }
  .sw div { display: flex; align-items: center; gap: 5px; min-width: 0; }
  .sw i { width: 20px; height: 20px; border-radius: 6px; box-shadow: inset 0 0 0 2px rgba(43, 36, 64, .1); flex: none; }
  code { font: 700 11px/14px var(--font-body); color: var(--ink-soft); }
  .demo { display: flex; align-items: center; gap: var(--space-2); min-height: 50px; flex-wrap: wrap; }
  .demo .b-stk { --size-sticker: 56px; pointer-events: none; }
  .room { flex: 1; height: 64px; border-radius: 10px; overflow: hidden; display: grid; grid-template-rows: 1fr 6px 18px; background: repeating-linear-gradient(90deg, var(--room-wall) 0 14px, var(--room-wall-pattern) 14px 18px); position: relative; }
  .room .tr { background: var(--room-trim); } .room .fl { background: repeating-linear-gradient(90deg, var(--room-floor) 0 26px, var(--room-floor-line) 26px 28px); }
  .room .wn { position: absolute; left: 14px; top: 8px; width: 34px; height: 26px; border-radius: 4px; background: var(--room-window-sky); box-shadow: 0 0 0 3px var(--room-trim); }
  .room .sel { position: absolute; right: 18px; top: 10px; width: 34px; height: 40px; border-radius: 8px; border: 3px dashed var(--room-item-select); background: var(--room-drop); }
  .days { display: flex; gap: 4px; } .days span { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font: 800 10px/1 var(--font-body); background: var(--streak-day-soft); color: var(--ink); }
  .days span.on { background: var(--streak-day); color: var(--ink); } .days span.fz { background: var(--freeze-card); color: var(--freeze-card-ink); }
  .paper { flex: 1; background: var(--print-paper); color: var(--print-ink); border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; font: 700 12px/16px var(--font-body); }
  .paper small { color: var(--print-muted); font-weight: 500; } .paper .ln { height: 14px; border-bottom: 1px solid var(--print-rule); }
  .vol { flex: 1; height: 10px; border-radius: 99px; background: linear-gradient(90deg, var(--volume-fill) 70%, var(--volume-track) 70%); }
  .scrim { width: 56px; height: 36px; border-radius: 8px; background: var(--focus-scrim); box-shadow: inset 0 0 0 1px var(--line); }
  .gard { flex: 1; height: 44px; border-radius: 10px; background: linear-gradient(var(--garden-sky) 0 55%, var(--garden-grass) 55% 88%, var(--garden-grass-shade) 88%); position: relative; }
  .gard i { position: absolute; bottom: 8px; width: 10px; height: 10px; border-radius: 50%; background: var(--garden-flower); }
  .tab { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; }
  .tab div { display: contents; } .tab code { border-bottom: 1px dashed var(--line); padding: 1px 0; } .tab b { font: 800 12px/16px var(--font-body); color: var(--ink); border-bottom: 1px dashed var(--line); text-align: right; }
  .note { font: 600 12px/16px var(--font-body); color: var(--ink-soft); margin: 0; }
  .wide { grid-column: span 2; }
</style></head>
<body>
<div class="p" id="p"></div>
<script>
(function () {
  var B = window.Bong, R = B.R;
  function sw(list) { return '<div class="sw">' + list.map(function (n) { return '<div><i style="background:var(--' + n + ')"></i><code>' + n + '</code></div>'; }).join('') + '</div>'; }
  function tab(rows) { return '<div class="tab">' + rows.map(function (x) { return '<div><code>' + x[0] + '</code><b>' + x[1] + '</b></div>'; }).join('') + '</div>'; }
  function dr(o) { return B.dragon('chao', 58, o).replace(/role="img"[^>]*?aria-label="[^"]*"/, 'aria-hidden="true"'); }
  document.getElementById('p').innerHTML =
    '<section><h3>Album & sticker</h3><div class="demo" style="padding-top:10px">' + R.sticker('cat', { size: 52, tilt: -4 }) + R.sticker('bus', { size: 52, isNew: true, tilt: 3 }) + R.sticker('trex', { owned: false, size: 52 }) + '</div>' +
      sw(['album-page', 'album-spine', 'album-ring', 'album-animals', 'album-vehicles', 'album-dino', 'album-fruits', 'sticker-frame', 'sticker-shadow', 'sticker-slot', 'sticker-slot-line', 'sticker-ghost', 'sticker-new']) + '</section>' +
    '<section><h3>Huy hiệu</h3><div class="demo">' + R.medal({ icon: 'flame', lv: 6, earned: true }, { size: 56 }) + R.medal({ icon: 'crown', lv: 5, earned: true }, { size: 56 }) + R.medal({ icon: 'book', lv: 4 }, { size: 56 }) + '</div>' +
      sw(['badge-ring', 'badge-ring-shade', 'badge-ribbon-a', 'badge-ribbon-b', 'badge-locked', 'badge-locked-ink']) + '<p class="note">Vành vàng = <code>star</code>; lõi theo màu cấp.</p></section>' +
    '<section><h3>Hộp quà</h3><div class="demo"><span style="width:64px">' + R.gift(false, 64) + '</span><span style="width:64px">' + R.gift(true, 64) + '</span></div>' +
      sw(['gift-box', 'gift-box-shade', 'gift-ribbon', 'gift-glow']) + '</section>' +
    '<section><h3>Phòng của tớ</h3><div class="demo"><div class="room"><span class="wn"></span><span class="sel"></span><span></span><span class="tr"></span><span class="fl"></span></div></div>' +
      sw(['room-wall', 'room-wall-pattern', 'room-trim', 'room-floor', 'room-floor-line', 'room-window-sky', 'room-item-select', 'room-drop', 'room-shadow']) + '</section>' +
    '<section><h3>Đồ cho Bông</h3><div class="demo" style="gap:0">' + dr({ top: 'tee', hat: 'cap' }) + dr({ top: 'stripe', hat: 'beanie' }) + dr({ top: 'raincoat', hat: 'sunhat' }) + '</div>' +
      sw(['outfit-tee', 'outfit-stripe-a', 'outfit-stripe-b', 'outfit-raincoat', 'outfit-cap', 'outfit-cap-brim', 'outfit-beanie', 'outfit-pompom', 'outfit-sunhat', 'outfit-ribbon']) + '</section>' +
    '<section><h3>Cửa hàng</h3><div class="demo"><span class="b-price">' + B.icon('coin', 22) + '80</span><span class="b-owned">' + B.icon('check', 16) + 'Đã có</span></div>' +
      sw(['price-chip', 'price-chip-ink', 'owned-chip']) + '<p class="note">Xu chỉ dùng trong trò chơi: không đổi ra tiền thật, không quảng cáo.</p></section>' +
    '<section><h3>Chuỗi ngày</h3><div class="demo"><div class="days"><span class="on">T2</span><span class="on">T3</span><span class="fz">' + B.icon('snow', 14) + '</span><span class="on">T5</span><span class="on">T6</span><span>T7</span><span>CN</span></div></div>' +
      sw(['streak-day', 'streak-day-soft', 'freeze-card', 'freeze-card-ink']) + '</section>' +
    '<section><h3>Bản in (trắng đen)</h3><div class="demo"><div class="paper"><span lang="en">lamp</span> · <small>cái đèn</small><div class="ln"></div><div class="ln"></div></div></div>' +
      sw(['print-paper', 'print-ink', 'print-muted', 'print-rule']) + '</section>' +
    '<section><h3>Học tập trung · vườn</h3><div class="demo" style="min-height:36px"><span class="scrim"></span><span class="vol"></span></div>' +
      sw(['focus-scrim', 'volume-track', 'volume-fill']) + '<div class="demo" style="min-height:44px"><div class="gard"><i style="left:20%"></i><i style="left:46%"></i><i style="left:74%"></i></div></div>' +
      sw(['garden-sky', 'garden-grass', 'garden-grass-shade', 'garden-flower', 'day-allowed']) + '</section>' +
    '<section><h3>Khu người lớn</h3>' + sw(['adm-lock', 'adm-unlocked-manual', 'adm-audio-missing']) + '<p class="note">Khoá · mở thủ công (tím) · thiếu âm thanh (cam, không dùng đỏ).</p></section>' +
    '<section><h3>Cỡ mới</h3>' + tab([['size-sticker', '112px'], ['size-sticker-frame', '6px'], ['size-badge', '120px'], ['size-shop-card', '220px'], ['size-room-item', '120px'], ['size-print-page-w', '210mm'], ['size-print-page-h', '297mm'], ['size-print-margin', '14mm'], ['size-print-pic', '16mm'], ['size-print-write', '48mm']]) + '</section>' +
    '<section><h3>Họ token Xu (<code>coins</code>)</h3>' + tab([['coin-lesson', '20 xu'], ['coin-sticker-lesson', '10 xu'], ['coin-badge', '50 xu'], ['coin-boss', '30 xu'], ['price-furniture-s', '40 xu'], ['price-furniture-m', '80 xu'], ['price-furniture-l', '150 xu'], ['price-special', '400 xu'], ['price-clothes', '60 xu'], ['price-hat', '50 xu']]) + '</section>';
  document.querySelectorAll('.b-stk').forEach(function (b) { b.tabIndex = -1; b.setAttribute('aria-hidden', 'true'); });
})();
</script>
</body>
</html>
