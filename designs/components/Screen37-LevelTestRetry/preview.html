<!-- @dsCard group="Màn Tiểu học · 28–32 Trùm & thi lên cấp" height=700 subtitle="32. Chưa đạt bài thi lên cấp (Screen37-LevelTestRetry): Bông động viên, số câu đúng (13/20, cần 16), 3 chủ đề nên ôn mỗi chủ đề có nút “Ôn chủ đề này” (phím 1–3), nút Thi lại sau" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Chưa đạt bài thi lên cấp — preview</title>
<style>
  .scr { background: radial-gradient(90% 70% at 20% 40%, var(--level-3-soft), var(--bg) 70%); }
  .rt { display: grid; grid-template-columns: 0.8fr 1.4fr; gap: var(--space-8); align-items: center; width: 100%; max-width: 1180px; }
  .enc { display: flex; flex-direction: column; align-items: center; gap: var(--space-3); text-align: center; }
  .enc .b-dragon { width: min(220px, 28cqh); height: auto; }
  .bub { position: relative; background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); padding: var(--space-3) var(--space-5); font: 800 min(22px, 2.9cqh)/1.35 var(--font-display); color: var(--ink); }
  .bub::after { content: ""; position: absolute; left: 50%; bottom: -12px; border: 12px solid transparent; border-bottom: 0; border-top-color: var(--surface); transform: translateX(-50%); }
  .res { background: var(--surface); border-radius: var(--radius-xl); box-shadow: var(--shadow-card); padding: var(--space-4) var(--space-5); width: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: var(--space-2); }
  .res__n { display: flex; align-items: baseline; justify-content: center; gap: var(--space-2); }
  .res__n b { font: 800 44px/48px var(--font-display); color: var(--ink); }
  .res__n span { font: 800 18px/22px var(--font-body); color: var(--ink-soft); }
  .meter { position: relative; display: grid; grid-template-columns: repeat(20, 1fr); gap: 4px; padding-top: 4px; }
  .meter i { height: 14px; border-radius: 4px; background: var(--surface-sunk); box-shadow: inset 0 0 0 2px var(--line); }
  .meter i.ok { background: var(--success); box-shadow: none; }
  .meter i.need { background: var(--retry-soft); box-shadow: inset 0 0 0 2px var(--retry); }
  .goal { font: 700 14px/18px var(--font-body); color: var(--ink-soft); }
  .topics { display: flex; flex-direction: column; gap: min(var(--space-3), 1.5cqh); }
  .topics h1 { margin: 0 0 var(--space-1); }
  .tp { background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); padding: min(var(--space-3), 1.5cqh) var(--space-4); display: grid; grid-template-columns: 52px 1fr auto; gap: var(--space-4); align-items: center; }
  .tp__ic { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; background: var(--level-3-soft); color: var(--level-3-ink); font: 800 22px/1 var(--font-display); }
  .tp__t { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .tp__t b { font: 800 20px/24px var(--font-display); color: var(--ink); }
  .tp__t b small { font: 700 15px/20px var(--font-body); color: var(--ink-soft); margin-left: 6px; }
  .ws { display: flex; gap: 6px; flex-wrap: wrap; }
  .w { display: inline-flex; align-items: center; gap: 4px; background: var(--surface-sunk); border-radius: var(--radius-pill); padding: 2px 10px 2px 2px; font: 700 16px/20px var(--font-display); color: var(--ink); }
  .w .b-speak { transform: scale(.82); margin: -4px; }
  .tp.is-go { box-shadow: 0 0 0 4px var(--brand-soft), var(--shadow-card); }
</style></head>
<body>
<div id="root"></div>
<script>
(function () {
  var B = window.Bong, L = B.L, TOTAL = 20, OK = 13, NEED = 16;
  var TOP = [{ vi: 'Quần áo', en: 'Clothes', got: 2, of: 5, w: [['shirt', 'áo sơ mi'], ['socks', 'tất'], ['dress', 'váy']] },
    { vi: 'Nhà của em', en: 'My home', got: 3, of: 5, w: [['kitchen', 'nhà bếp'], ['window', 'cửa sổ']] },
    { vi: 'Cơ thể', en: 'My body', got: 3, of: 5, w: [['shoulder', 'vai'], ['knee', 'đầu gối']] }];
  var SAY = 'You did well! Let’s practise and try again!';
  function meter() { var o = ''; for (var i = 0; i < TOTAL; i++) o += '<i class="' + (i < OK ? 'ok' : i < NEED ? 'need' : '') + '"></i>'; return '<div class="meter" role="img" aria-label="' + OK + ' câu đúng, cần ' + NEED + ' câu">' + o + '</div>'; }
  B.screen({
    fit: true, level: 3,
    notes: { normal: 'Không dùng chữ “trượt”, không màu đỏ. Bông (dáng cấp 3, biểu cảm động viên) khen phần làm được. Thước 20 ô: xanh = đúng, viền cam = còn thiếu để đạt 16. 3 chủ đề nên ôn (câu sai nhiều nhất), mỗi chủ đề có từ hay sai kèm loa và nút “Ôn chủ đề này” (phím 1–3). Thi lại sau (Enter): về bản đồ, cổng vẫn mở; ôn xong 1 chủ đề là thi lại được.', loading: 'Khung xương khi đang chấm bài.', empty: 'Chưa có kết quả bài thi.', error: 'Không tải được kết quả.' },
    states: {
      normal: function () {
        return L.head({ n: TOTAL, total: TOTAL, dots: true, count: OK + '/20' }) + '<main class="lesson-main"><div class="rt"><div class="enc"><div class="bub">Cậu làm tốt lắm rồi! Ôn thêm chút xíu là lên đảo Cành cây thôi!</div>' + L.grow(3, 'dongvien', 220) +
          '<div class="res"><div class="res__n"><b>' + OK + '/20</b><span>câu đúng</span></div>' + meter() + '<span class="goal">Cần ' + NEED + ' câu (80%) · còn thiếu <b>' + (NEED - OK) + ' câu</b> nữa thôi</span></div></div>' +
          '<div class="topics"><h1 class="title">Bông gợi ý ôn 3 chủ đề này</h1>' + TOP.map(function (t, i) {
            return '<section class="tp" aria-label="Chủ đề ' + t.vi + '"><span class="tp__ic">' + (i + 1) + '</span><div class="tp__t"><b>' + t.vi + ' <small lang="en">' + t.en + ' · đúng ' + t.got + '/' + t.of + ' câu</small></b><div class="ws">' + t.w.map(function (w) { return '<span class="w">' + B.speak(w[0], 's') + '<span lang="en">' + w[0] + '</span><small class="b-muted" style="font:700 13px/16px var(--font-body)">' + w[1] + '</small></span>'; }).join('') + '</div></div>' +
              B.btn({ label: 'Ôn chủ đề này', variant: i === 0 ? 'primary' : 'secondary', key: String(i + 1), icon: 'book', attrs: 'data-rev="' + i + '"' }) + '</section>';
          }).join('') + '</div></div></main>' +
          L.foot({ replayLabel: 'Nghe Bông nói', hint: false, main: { label: 'Thi lại sau', icon: 'map' } });
      },
      loading: function () { return L.head({ n: TOTAL, total: TOTAL, dots: true, count: '20/20' }) + '<main class="lesson-main"><div class="rt"><div class="enc">' + B.dragon('suynghi', 200) + '<p class="body-l">Bông đang chấm bài…</p></div><div class="topics">' + B.sk('60%', '34px', 'var(--radius-pill)') + B.sk('100%', '92px', 'var(--radius-lg)') + B.sk('100%', '92px', 'var(--radius-lg)') + B.sk('100%', '92px', 'var(--radius-lg)') + '</div></div></main>' + L.foot({ off: true, hint: false, main: { label: 'Thi lại sau' } }); },
      empty: function () { return L.head({ n: 0, total: TOTAL, dots: true, count: '—' }) + '<main class="lesson-main">' + B.stateBlock({ kind: 'empty', title: 'Chưa có kết quả bài thi', text: 'Cậu làm bài thi ở cổng cuối đảo Lá xanh nhé!', action: B.btn({ label: 'Về bản đồ', icon: 'map', size: 'l' }) }) + '</main>' + L.foot({ off: true, hint: false, main: { label: 'Thi lại sau' } }); },
      error: function () { return L.head({ n: TOTAL, total: TOTAL, dots: true, count: '20/20' }) + '<main class="lesson-main">' + B.stateBlock({ kind: 'error', title: 'Chưa tải được kết quả', text: 'Bài làm của cậu vẫn được giữ. Mình thử lại nhé!' }) + '</main>' + L.foot({ off: true, hint: false, main: { label: 'Thi lại sau' } }); }
    },
    mount: { normal: function (scr, ctx) {
      function rev(i) { var t = TOP[i], sec = scr.querySelectorAll('.tp')[i]; scr.querySelectorAll('.tp').forEach(function (x) { x.classList.remove('is-go'); }); sec.classList.add('is-go'); ctx.burst(sec.querySelector('[data-rev]'), null, 6);
        ctx.feedback({ type: 'ok', title: 'Mở bài ôn “' + t.vi + '”', detail: '<span>5 câu ngắn về <b class="en">' + t.w.map(function (w) { return w[0]; }).join(', ') + '</b>. Ôn xong là thi lại được ngay!</span>', action: 'Bắt đầu ôn' }); }
      scr.querySelectorAll('[data-rev]').forEach(function (b) { b.addEventListener('click', function () { rev(+b.dataset.rev); }); });
      function later() { ctx.feedback({ type: 'ok', title: 'Cổng vẫn mở chờ cậu!', detail: '<span>Lúc nào sẵn sàng, bấm cổng cuối đảo Lá xanh để thi lại.</span>', action: 'Về bản đồ' }); }
      L.wire(scr, ctx, { left: 0, onReplay: function (b) { L.say(SAY, .8, b); }, onMain: later, onExit: later,
        onKey: function (e) { if (/^[1-3]$/.test(e.key)) { e.preventDefault(); rev(+e.key - 1); return true; } } });
      ctx.later(function () { var a = document.activeElement; if (!a || a === document.body) scr.querySelector('[data-rev]').focus({ preventScroll: true }); }, 60);
    } }
  });
})();
</script>
</body>
</html>
