      scr.querySelectorAll('[data-add]').forEach(function (b) { b.addEventListener('click', function () {
        var p = find(b.dataset.add).n, isT = p.type === 'level';
        A.dialog(scr, { title: isT ? 'Thêm chủ đề vào Cấp ' + p.n : 'Thêm bài học vào “' + p.name + '”', body: A.field({ id: 'nw', label: isT ? 'Tên chủ đề' : 'Tên bài học', required: true, placeholder: isT ? 'Ví dụ: Sports' : 'Ví dụ: Bài 5 · Fruit salad' }) + '<p class="adm-small" style="margin:0">Mục mới được tạo ở trạng thái <b>Nháp</b>.</p>',
          actions: [{ label: 'Huỷ' }, { label: 'Thêm', variant: 'primary', icon: 'plus', onClick: function (w) { var v = w.querySelector('#nw').value.trim(); var m = !v ? 'Nhập tên trước khi thêm.' : p.kids.some(function (k) { return k.name.toLowerCase() === v.toLowerCase(); }) ? 'Đã có mục cùng tên trong nhóm này.' : ''; A.setErr(w, 'nw', m); if (m) { w.querySelector('#nw').focus(); return false; }
            var nn = isT ? { id: 'n' + (++uid), type: 'topic', name: v, unit: '—', open: true, status: 'draft', kids: [] } : { id: 'n' + (++uid), type: 'lesson', name: v, en: '', steps: 0, min: 10, status: 'draft' }; p.kids.push(nn); p.open = true; S.sel = nn.id; setTimeout(function () { re('[data-sel="' + nn.id + '"]'); A.toast(ctx.scr, 'Đã thêm “' + v + '” (nháp).'); }, 0); } }] });
      }); });
      var f = find(S.sel); if (!f) return;
      if (f.n.status === 'none') {
        scr.querySelector('[data-fwopen]').addEventListener('click', function () { fwDrawer(scr, ctx, f.n, f.parent); });
        scr.querySelector('[data-fwexp]').addEventListener('click', function () { A.toast(ctx.scr, 'Đã tạo chu-de-' + f.n.id.slice(3) + '.xlsx: trang Chủ đề + ' + f.n.target + ' dòng từ để điền.'); });
        scr.querySelector('[data-fwimp]').addEventListener('click', function () { A.toast(ctx.scr, 'Mở Nhập & xuất Excel › Chủ đề mới cho “' + f.n.name + '”.'); });
        if (S.openFw) { S.openFw = false; fwDrawer(scr, ctx, f.n, f.parent); }
        return;
      }
      var st = f.n.status;
      var sg = scr.querySelector('#e-st'); sg && sg.addEventListener('segchange', function (e) { st = e.detail; A.setErr(scr, 'e-st', ''); });
      var rules = { 'e-name': function (v) { return !v.trim() ? 'Tên không được để trống.' : v.trim().length > 50 ? 'Tên tối đa 50 ký tự.' : ''; } };
      if (scr.querySelector('#e-min')) rules['e-min'] = function (v) { return !/^\d+$/.test(v.trim()) ? 'Nhập số phút (5–30).' : +v < 5 || +v > 30 ? 'Thời lượng một bài từ 5 đến 30 phút.' : ''; };
      A.wireValidate(scr, rules);
      scr.querySelector('[data-save]').addEventListener('click', function () {
        if (A.validate(scr, rules)) return;
        if (f.n.type === 'lesson' && st === 'live' && !f.n.steps) { A.setErr(scr, 'e-st', 'Bài chưa có bước nào nên chưa xuất bản được. Mở Soạn bài học để thêm bước.'); return; }
        if (f.n.type === 'topic' && st === 'live' && !f.n.kids.length) { A.setErr(scr, 'e-st', 'Chủ đề chưa có bài học nào nên chưa xuất bản được.'); return; }
        f.n.name = scr.querySelector('#e-name').value.trim(); if (scr.querySelector('#e-min')) f.n.min = +scr.querySelector('#e-min').value; if (f.n.status !== undefined) f.n.status = st;
        re('[data-sel="' + f.n.id + '"]'); A.toast(ctx.scr, 'Đã lưu “' + f.n.name + '”.');
      });
      scr.querySelector('[data-cancel]').addEventListener('click', function () { re('[data-sel="' + f.n.id + '"]'); });
      var del = scr.querySelector('[data-del]'); del && del.addEventListener('click', function () {
        var cnt = f.n.kids ? ' và ' + count(f.n) + ' bên trong' : '';
        A.dialog(scr, { title: 'Xoá “' + f.n.name + '”?', body: '<p style="margin:0">Mục này' + cnt + ' sẽ chuyển vào Thùng rác 30 ngày. Tiến độ của học sinh ở mục này được giữ lại.</p>', actions: [{ label: 'Huỷ' }, { label: 'Xoá', variant: 'danger', icon: 'trash', onClick: function () { f.list.splice(f.list.indexOf(f.n), 1); S.sel = f.parent ? f.parent.id : null; setTimeout(function () { re(S.sel && '[data-sel="' + S.sel + '"]'); A.toast(ctx.scr, 'Đã chuyển vào Thùng rác.'); }, 0); } }] });
      });
    }, all: function (scr) { var p = scr.querySelector('[data-pub]'); p && p.addEventListener('click', function () { A.toast(scr, 'Đã xuất bản 3 thay đổi. Học sinh thấy sau khi tải lại app.'); }); } }
  });
})();
</script>
