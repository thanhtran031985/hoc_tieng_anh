<!-- @dsCard group="Màn Tiểu học · 6–9 Bài học" height=700 subtitle="9b. Mini game Mưa từ vựng — từ rơi xuống, gõ đúng chính tả rồi Enter để phá (gõ thử: cat, dog…)" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Mưa từ vựng — preview</title>
<style>
  .scr { background: var(--bg-sea); }
  .rain-head { background: transparent; }
  .field { flex: 1; min-height: 0; position: relative; overflow: hidden; width: 100%; max-width: var(--size-content-max); margin: 0 auto; }
  .cloud { position: absolute; background: var(--surface); border-radius: var(--radius-pill); opacity: .8; }
  .cloud::before, .cloud::after { content: ""; position: absolute; background: inherit; border-radius: 50%; }
  .cloud::before { width: 50%; height: 140%; left: 16%; top: -60%; } .cloud::after { width: 36%; height: 110%; right: 14%; top: -40%; }
  .drop { position: absolute; top: 0; transform: translate(-50%, 0); display: flex; flex-direction: column; align-items: center; gap: 4px; will-change: transform; }
  .drop .bub { display: flex; align-items: center; gap: var(--space-2); background: var(--surface); border-radius: var(--radius-pill); padding: 6px 18px 6px 6px; box-shadow: 0 5px 0 var(--bg-sea-deep), 0 10px 20px rgba(43,36,64,.12); border: var(--border-thin) solid var(--surface); }
  .drop .bub .b-pic { width: 52px; height: 52px; background: var(--surface-soft); border-radius: 50%; }
  .drop .wd { font: 700 32px/36px var(--font-display); color: var(--ink); letter-spacing: .02em; }
  .drop .wd .hit { color: var(--success-shade); text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: 5px; }
  .drop.is-target .bub { border-color: var(--success); }
  .drop.pop { animation: popout .45s ease forwards; }
  @keyframes popout { 40% { transform: translate(-50%, var(--y)) scale(1.2); } 100% { transform: translate(-50%, var(--y)) scale(0); opacity: 0; } }
  .ground { position: absolute; left: 0; right: 0; bottom: 0; height: 40px; background: var(--level-2); box-shadow: inset 0 8px 0 var(--level-2-soft); }
  .puddle { position: absolute; bottom: 12px; padding: 4px 12px; border-radius: var(--radius-pill); background: var(--bg-sea-deep); font: 800 14px/18px var(--font-body); color: var(--ink); animation: fade 2.2s ease forwards; transform: translateX(-50%); }
  @keyframes fade { 70% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, 6px); } }
  .typebar { flex: none; background: var(--bg); border-top: var(--border-thin) solid var(--line); }
  .typebar > div { height: 112px; max-width: var(--size-content-max); margin: 0 auto; padding: 0 var(--space-12); box-sizing: border-box; display: flex; align-items: center; gap: var(--space-5); }
  .typebar .b-dragon { width: 84px; height: auto; margin-top: -30px; }
  .tin { flex: 1; max-width: 560px; height: 64px; font: 700 30px/36px var(--font-display); letter-spacing: .04em; border-radius: var(--radius-lg); }
  .tin.shake { animation: b-shake .45s ease; border-color: var(--retry); background: var(--retry-soft); }
  .msg { flex: 1; }
  .score { display: flex; gap: var(--space-3); }
  @container (max-height: 800px) { .typebar > div { height: 96px; } .tin { height: 56px; } }
  @container (max-width: 1400px) { .typebar > div { padding: 0 var(--space-10); } }
</style></head>
<body>
<div id="root"></div>
<script>
(function () {
  var B = window.Bong;
  var POOL = ['cat', 'dog', 'fish', 'bird', 'duck', 'apple', 'pear', 'ball', 'kite', 'red'];
  var S = { score: 0, paused: false, msg: 'Gõ từ đang rơi rồi nhấn Enter nhé!', expr: 'chao' };
  function head(off) {
    return '<header class="lesson-head rain-head"><button type="button" class="b-iconbtn" aria-label="Thoát trò chơi" data-exit>' + B.icon('close', 26) + '</button><h1 class="title" style="flex:1">Mưa từ vựng</h1>' +
      '<div class="score"><span class="b-stat" data-sc>' + B.icon('star', 28) + '<span class="stat">' + S.score + '</span><span class="b-sr">từ đã phá</span></span>' +
      '<button type="button" class="b-iconbtn" data-pause aria-label="Tạm dừng" aria-keyshortcuts="Escape"' + (off ? ' disabled' : '') + '>' + B.icon(S.paused ? 'play' : 'pause', 26) + '</button></div></header>';
  }
  function bar(off) {
    return '<div class="typebar"><div>' + B.dragon(S.expr, 84) + '<span class="msg body-l" aria-live="polite">' + S.msg + '</span>' +
      '<input class="b-input tin en" data-in placeholder="gõ ở đây…" aria-label="Gõ từ tiếng Anh" autocomplete="off" spellcheck="false"' + (off ? ' disabled' : '') + '>' + B.btn({ label: 'Phá', size: 'l', key: 'Enter', attrs: 'data-fire', disabled: off }) + '</div></div>';
  }
  var clouds = '<span class="cloud" style="left:8%;top:14%;width:140px;height:40px"></span><span class="cloud" style="left:70%;top:8%;width:180px;height:48px"></span><span class="cloud" style="left:44%;top:30%;width:110px;height:32px"></span>';
  B.screen({
    fit: true, level: 1,
    notes: { normal: 'Từ rơi chậm (Tiểu học). Chữ gõ đúng đến đâu, từ được gạch xanh đến đó. Từ chạm đất không bị phạt — nó sẽ quay lại sau. Esc tạm dừng.', loading: 'Chuẩn bị danh sách từ.', empty: 'Chưa có từ đã học để chơi.', error: 'Không tải được trò chơi.' },
    states: {
      normal: function () { return head() + '<div class="field">' + clouds + '<div class="ground"></div></div>' + bar(); },
      loading: function () { return head(true) + '<div class="field">' + clouds + '<div class="b-state">' + B.dragon('suynghi', 160) + '<p class="body-l">Bông đang gọi mây…</p></div><div class="ground"></div></div>' + bar(true); },
      empty: function () { return head(true) + '<div class="field">' + clouds + B.stateBlock({ kind: 'empty', title: 'Chưa có từ nào để mưa', text: 'Học 1 bài trên bản đồ là có từ để chơi ngay!', action: B.btn({ label: 'Về bản đồ', icon: 'map', size: 'l' }) }) + '</div>' + bar(true); },
      error: function () { return head(true) + '<div class="field">' + clouds + B.stateBlock({ kind: 'error', title: 'Mây chưa kéo tới', text: 'Trò chơi chưa tải xong. Mình thử lại nhé!' }) + '</div>' + bar(true); }
    },
    mount: {
      normal: function (scr, ctx) {
        var field = scr.querySelector('.field'), inp = scr.querySelector('[data-in]'), msg = scr.querySelector('.msg'), drops = [], raf, last = 0, spawnT = 0, alive = true, k = 0;
        var H = function () { return field.clientHeight; };
        function spawn() {
          var used = drops.map(function (d) { return d.w; }), cand = POOL.filter(function (w) { return used.indexOf(w) < 0; });
          var w = cand[(k++ * 7) % cand.length], x = 12 + ((k * 23) % 76);
          var el = document.createElement('div'); el.className = 'drop'; el.style.left = x + '%';
          el.innerHTML = '<div class="bub">' + B.pic(w, 52) + '<span class="wd en">' + w + '</span></div>'; field.appendChild(el);
          drops.push({ w: w, el: el, y: -80, v: 34 + (k % 3) * 6 }); paint();
        }
        function paint() {
          var t = inp.value.trim().toLowerCase();
          drops.forEach(function (d) {
            var n = t && d.w.indexOf(t) === 0 ? t.length : 0;
            d.el.querySelector('.wd').innerHTML = n ? '<span class="hit">' + d.w.slice(0, n) + '</span>' + d.w.slice(n) : d.w;
            d.el.classList.toggle('is-target', n > 0);
          });
        }
        function tick(ts) {
          if (!alive) return;
          var dt = last ? Math.min(0.05, (ts - last) / 1000) : 0; last = ts;
          if (!S.paused) {
            spawnT -= dt; if (spawnT <= 0 && drops.length < 4) { spawn(); spawnT = 2.6; }
            drops.forEach(function (d) { d.y += d.v * dt; d.el.style.transform = 'translate(-50%,' + d.y + 'px)'; });
            drops = drops.filter(function (d) {
              if (d.y > H() - 110) { var p = document.createElement('span'); p.className = 'puddle'; p.style.left = d.el.style.left; p.textContent = d.w + ' sẽ quay lại sau'; field.appendChild(p); setTimeout(function () { p.remove(); }, 2300); d.el.remove(); return false; }
              return true;
            });
          }
          raf = requestAnimationFrame(tick);
        }
        raf = requestAnimationFrame(tick);
        ctx.cleanup = function () { alive = false; cancelAnimationFrame(raf); };
        function fire() {
          var t = inp.value.trim().toLowerCase(); if (!t) return;
          var hit = drops.filter(function (d) { return d.w === t; })[0];
          if (hit) {
            S.score++; scr.querySelector('[data-sc] .stat').textContent = S.score;
            hit.el.style.setProperty('--y', hit.y + 'px'); hit.el.classList.add('pop'); ctx.burst(hit.el.querySelector('.bub'), scr.querySelector('[data-sc]'), 6); B.say(hit.w);
            drops = drops.filter(function (d) { return d !== hit; }); setTimeout(function () { hit.el.remove(); }, 460);
            msg.innerHTML = ['Bùm! Đúng rồi!', 'Giỏi quá!', 'Chính tả chuẩn luôn!'][S.score % 3] + ' <b class="en">' + hit.w + '</b> = ' + B.words[hit.w].vi; inp.value = '';
          } else {
            inp.classList.remove('shake'); void inp.offsetWidth; inp.classList.add('shake');
            var near = drops.filter(function (d) { return d.w[0] === t[0]; })[0];
            msg.innerHTML = near ? 'Gần đúng rồi! Nhìn kỹ chữ <b class="en">' + near.w + '</b> nhé.' : 'Chưa có từ này trên trời. Thử từ khác nhé!';
          }
          paint();
        }
        inp.addEventListener('input', function () { inp.classList.remove('shake'); paint(); });
        inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); fire(); } if (e.key === 'Escape') { S.paused = !S.paused; scr.querySelector('[data-pause]').innerHTML = B.icon(S.paused ? 'play' : 'pause', 26); } });
        scr.querySelector('[data-fire]').addEventListener('click', function () { fire(); inp.focus(); });
        scr.querySelector('[data-pause]').addEventListener('click', function (e) { S.paused = !S.paused; e.currentTarget.innerHTML = B.icon(S.paused ? 'play' : 'pause', 26); msg.textContent = S.paused ? 'Đang tạm dừng. Bấm ▶ để chơi tiếp.' : 'Chơi tiếp nào!'; });
        scr.querySelector('[data-exit]').addEventListener('click', function () { S.paused = true; ctx.dialog({ expr: 'dongvien', title: 'Dừng trò chơi?', body: 'Bé đã phá được ' + S.score + ' từ rồi đó!', actions: [{ label: 'Chơi tiếp', variant: 'primary', key: 'Enter', onClick: function () { S.paused = false; } }, { label: 'Dừng lại', variant: 'secondary', key: 'Esc' }] }); });
        ctx.later(function () { inp.focus({ preventScroll: true }); }, 100);
      }
    }
  });
})();
</script>
</body>
</html>
