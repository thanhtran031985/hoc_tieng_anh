<!-- @dsCard group="Màn Tiểu học · 18–24 Dạng bài mới" height=700 subtitle="22. Nghe và gõ (Screen27-Dictation): loa lớn, mỗi chữ cái một ô cho từ ngắn, một dòng cho câu; gợi ý hiện chữ đầu rồi phát chậm; chữ sai tô cam, giữ phần đúng" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Nghe và gõ — preview</title>
<style>
  .dc { display: flex; flex-direction: column; align-items: center; gap: min(var(--space-8), 4cqh); }
  .top { display: flex; align-items: center; gap: var(--space-6); }
  .top .b-dragon { width: min(120px, 14cqh); height: auto; }
  .boxes { display: flex; gap: var(--space-3); }
  .lb { width: min(96px, 12cqh); height: min(112px, 14cqh); border-radius: var(--radius-lg); border: var(--border-thick) solid var(--line-strong); background: var(--surface); box-shadow: 0 6px 0 var(--line); text-align: center; font: 800 min(60px, 7.5cqh)/1 var(--font-display); color: var(--ink); text-transform: lowercase; padding: 0; caret-color: var(--brand); }
  .lb:focus { border-color: var(--brand); box-shadow: 0 6px 0 var(--brand-shade), var(--shadow-focus); outline: none; }
  .lb.is-ok { border-color: var(--success); background: var(--success-soft); box-shadow: 0 6px 0 var(--success-shade); }
  .lb.is-bad { border-color: var(--retry); background: var(--retry-soft); box-shadow: 0 6px 0 var(--retry-shade); }
  .lb.is-given { background: var(--read-highlight); border-color: var(--star-shade); }
  .line { width: min(880px, 70cqw); height: min(104px, 13cqh); border-radius: var(--radius-lg); border: var(--border-thick) solid var(--line-strong); background: var(--surface); box-shadow: 0 6px 0 var(--line); font: 800 min(48px, 6cqh)/1 var(--font-display); color: var(--ink); padding: 0 var(--space-6); caret-color: var(--brand); }
  .line:focus { border-color: var(--brand); box-shadow: 0 6px 0 var(--brand-shade), var(--shadow-focus); outline: none; }
  .diff { font: 800 min(40px, 5cqh)/1.3 var(--font-display); letter-spacing: .02em; min-height: min(52px, 6.5cqh); }
  .diff .bad { background: var(--retry-soft); color: var(--retry-shade); border-bottom: 4px solid var(--retry); border-radius: 4px; }
  .diff .miss { color: var(--line-strong); }
  .hintbar { display: flex; gap: var(--space-3); align-items: center; min-height: 40px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; background: var(--info-soft); border-radius: var(--radius-pill); padding: 6px 14px; font: 800 16px/20px var(--font-body); }
</style></head>
<body>
<div id="root"></div>
<script>
(function () {
  var B = window.Bong, L = B.L;
  var QS = [{ t: 'cat', vi: 'con mèo' }, { t: 'fish', vi: 'con cá' }, { t: 'I can see a bird.', vi: 'Tớ nhìn thấy một con chim.', line: true }];
  var S = { q: 0, step: 7, total: 10, val: [], hint: 0, tries: 0, done: false, mark: null };
  function Q() { return QS[S.q % QS.length]; }
  function norm(x) { return x.toLowerCase().replace(/[.,!?]/g, '').replace(/\s+/g, ' ').trim(); }
  function reset() { var q = Q(); S.val = q.line ? [''] : q.t.split('').map(function () { return ''; }); S.hint = 0; S.tries = 0; S.done = false; S.mark = null; }
  reset();
  function body() {
    var q = Q();
    var input = q.line ? '<label class="b-sr" for="dl">Gõ câu vừa nghe</label><input class="line" id="dl" lang="en" autocomplete="off" spellcheck="false" value="' + B.esc(S.val[0]) + '" placeholder="' + (S.hint >= 1 ? 'I …' : 'Gõ câu vừa nghe…') + '">' +
        '<div class="diff" aria-live="polite">' + (S.mark ? S.mark : '') + '</div>'
      : '<div class="boxes" role="group" aria-label="Gõ từ vừa nghe, ' + q.t.length + ' chữ cái">' + q.t.split('').map(function (c, i) { var given = S.hint >= 1 && i === 0; return '<input class="lb' + (given ? ' is-given' : '') + (S.mark && S.mark[i] === true ? ' is-ok' : S.mark && S.mark[i] === false ? ' is-bad' : '') + '" data-b="' + i + '" maxlength="1" autocomplete="off" spellcheck="false" aria-label="Chữ cái ' + (i + 1) + '" value="' + (given ? c : B.esc(S.val[i])) + '"' + (given || S.done ? ' readonly' : '') + '>'; }).join('') + '</div>';
    var full = q.line ? S.val[0].trim().length > 0 : S.val.every(function (v, i) { return v || (S.hint >= 1 && i === 0); });
    return L.head({ n: S.step, total: S.total }) + '<main class="lesson-main"><div class="instr"><h1 class="title">Nghe và gõ ' + (q.line ? 'câu' : 'từ') + '</h1></div><div class="dc">' +
      '<div class="top">' + B.dragon(S.tries ? 'dongvien' : 'chao', 120) + B.speak(q.t, 'l', 'Nghe ' + (q.line ? 'câu' : 'từ') + ' cần gõ') + '<span class="caption b-muted" style="width:120px">Bấm loa hoặc ' + B.key(q.line ? 'Ctrl+Space' : 'Space') + '</span></div>' + input +
      '<div class="hintbar">' + (S.hint >= 1 ? '<span class="chip">' + B.icon('bulb', 18) + 'Chữ đầu: <b class="en">' + q.t[0] + '</b></span>' : '') + (S.hint >= 2 ? '<span class="chip">' + B.icon('speaker', 18) + 'Bông đã đọc chậm</span>' : '') + '</div></div></main>' +
      L.foot({ replayKey: q.line ? 'Ctrl+Space' : 'Space', hintKey: '?', hintOff: S.hint >= 2 || S.done, main: { disabled: !full || S.done } });
  }
  B.screen({
    fit: true, level: 2,
    notes: { normal: 'Gõ bằng bàn phím thật: mỗi ô một chữ cái (tự nhảy ô, Backspace lùi ô). Space nghe lại (câu: Ctrl+Space vì dấu cách dùng để gõ). Gợi ý bằng nút hoặc phím ? (vì H là chữ cái cần gõ): lần 1 hiện chữ đầu, lần 2 Bông đọc chậm. Chưa đúng: chữ sai tô cam, chữ đúng được giữ. Ví dụ tiếp: fish · “I can see a bird.” (một dòng).', loading: 'Khung xương loa và ô chữ.', empty: 'Bài chưa có từ để gõ.', error: 'Không phát được âm thanh.' },
    states: {
      normal: body,
      loading: function () { return L.head({ n: S.step, total: S.total }) + '<main class="lesson-main"><div class="dc">' + B.sk('112px', '112px', '50%') + '<div class="boxes">' + [1, 2, 3].map(function () { return B.sk('min(96px, 12cqh)', 'min(112px, 14cqh)', 'var(--radius-lg)'); }).join('') + '</div></div></main>' + L.foot({ off: true }); },
      empty: function () { return L.head({ n: 0, total: S.total }) + '<main class="lesson-main">' + B.stateBlock({ kind: 'empty', title: 'Bài này chưa có từ để gõ', text: 'Bông sẽ báo cậu khi bài sẵn sàng nhé!', action: B.btn({ label: 'Về bản đồ', icon: 'map', size: 'l' }) }) + '</main>' + L.foot({ off: true }); },
      error: function () { return L.head({ n: S.step, total: S.total }) + '<main class="lesson-main">' + B.stateBlock({ kind: 'error', title: 'Loa chưa phát được', text: 'Bông chưa tải được âm thanh. Không phải lỗi của cậu đâu!' }) + '</main>' + L.foot({ off: true }); }
    },
    mount: { normal: function (scr, ctx) {
      var q = Q();
      function re(sel) { ctx.setState('normal'); var f = sel && ctx.scr.querySelector(sel); if (f) { f.focus({ preventScroll: true }); if (f.setSelectionRange && f.value) f.setSelectionRange(f.value.length, f.value.length); } }
      function full() { return q.line ? S.val[0].trim().length > 0 : S.val.every(function (v, i) { return v || (S.hint >= 1 && i === 0); }); }
      function sync() { var m = scr.querySelector('[data-main]'); if (m) m.disabled = !full() || S.done; }
      function check() {
        if (S.done || !full()) return;
        if (S.hint >= 1 && !q.line) S.val[0] = q.t[0];
        var ok = q.line ? norm(S.val[0]) === norm(q.t) : S.val.join('').toLowerCase() === q.t;
        if (ok) { S.done = true; S.mark = q.line ? '<span lang="en">' + B.esc(q.t) + '</span>' : q.t.split('').map(function () { return true; }); re(); L.ok(ctx.scr, ctx, { from: ctx.scr.querySelector('.dc'), n: S.step + 1, total: S.total, title: 'Gõ đúng rồi! Giỏi quá!', say: q.t, detail: B.speak(q.t, 's') + '<b class="en" style="font-size:26px">' + q.t + '</b><span class="b-muted">' + q.vi + '</span>', onNext: function () { S.q++; S.step = S.step >= S.total - 1 ? 1 : S.step + 1; reset(); re(Q().line ? '#dl' : '[data-b="0"]'); } }); return; }
        S.tries++;
        if (q.line) { var a = norm(S.val[0]), t = norm(q.t), out = ''; for (var i = 0; i < Math.max(a.length, t.length); i++) { var c = a[i] || ''; out += c === t[i] ? B.esc(c) : c ? '<span class="bad">' + B.esc(c) + '</span>' : '<span class="miss">_</span>'; } S.mark = out; }
        else S.mark = S.val.map(function (v, i) { return v.toLowerCase() === q.t[i]; });
        if (S.tries >= 2) S.hint = Math.max(S.hint, 1);
        re(); L.retry(ctx.scr, ctx, { tries: S.tries, detail: 'Chữ tô cam chưa đúng, phần còn lại cậu gõ đúng rồi. Nghe lại nhé.', onRetry: function () { if (!q.line) S.val = S.val.map(function (v, i) { return S.mark[i] ? v : ''; }); S.mark = q.line ? S.mark : null; if (S.tries >= 2) L.say(q.t, .5); re(q.line ? '#dl' : '[data-b="' + Math.max(0, S.val.indexOf('')) + '"]'); } });
      }
      var bs = scr.querySelectorAll('[data-b]');
      bs.forEach(function (b, i) {
        b.addEventListener('input', function () { var v = b.value.replace(/[^a-z]/gi, '').slice(-1); b.value = v; S.val[i] = v; if (S.mark) { S.mark = null; b.classList.remove('is-bad', 'is-ok'); } if (v && bs[i + 1]) { var n = bs[i + 1]; n.focus(); n.select && n.select(); } sync(); });
        b.addEventListener('keydown', function (e) {
          if (e.key === ' ') { e.preventDefault(); L.say(q.t, .8, scr.querySelector('.b-speak--l')); }
          else if (e.key === 'Backspace' && !b.value && bs[i - 1] && !bs[i - 1].readOnly) { e.preventDefault(); bs[i - 1].value = ''; S.val[i - 1] = ''; bs[i - 1].focus(); sync(); }
          else if (e.key === 'ArrowLeft' && bs[i - 1]) { e.preventDefault(); bs[i - 1].focus(); }
          else if (e.key === 'ArrowRight' && bs[i + 1]) { e.preventDefault(); bs[i + 1].focus(); }
        });
        b.addEventListener('focus', function () { b.select && b.select(); });
      });
      var dl = scr.querySelector('#dl'); dl && dl.addEventListener('input', function () { S.val[0] = dl.value; sync(); });
      L.wire(scr, ctx, { left: S.total - S.step,
        onReplay: function (b) { L.say(q.t, .8, b); },
        onHint: function () { S.hint++; if (S.hint === 1 && !q.line) S.val[0] = q.t[0]; if (S.hint >= 2) L.say(q.t, .45); re(q.line ? '#dl' : '[data-b="' + (S.val.indexOf('') > -1 ? S.val.indexOf('') : 0) + '"]'); },
        onMain: check,
        onKey: function (e) {
          if (e.key === ' ' && e.ctrlKey) { e.preventDefault(); L.say(q.t, .8, scr.querySelector('.b-speak--l')); return true; }
          if (e.key === '?') { e.preventDefault(); var h = scr.querySelector('[data-hint]'); if (h && !h.disabled) h.click(); return true; }
          if ((e.key === 'h' || e.key === 'H') && L.typing()) return true;
          if ((e.key === 'h' || e.key === 'H') && !L.typing()) return true;
        }
      });
      ctx.later(function () { var f = scr.querySelector(q.line ? '#dl' : '[data-b]:not([readonly])'); f && f.focus({ preventScroll: true }); L.say(q.t, .8); }, 200);
    } }
  });
})();
</script>
</body>
</html>
